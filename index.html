<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 배정고 오늘의 급식!</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍱</text></svg>">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root {
            --primary: #4CAF50; --primary-light: #E8F5E9;
            --secondary: #FF9800; --secondary-light: #FFF3E0;
            --info: #2196F3; --bg: #F5F7FA; --card: #FFFFFF; --like: #FF5252;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg); margin: 0; padding: clamp(15px, 2.5vh, 28px) 0; display: flex; justify-content: center; min-height: 100vh; color: #333; }
        button, input { font: inherit; }
        button:focus-visible, input:focus-visible { outline: 3px solid rgba(33,150,243,0.35); outline-offset: 2px; }
        .app-container { width: min(calc(100% - 20px), clamp(460px, 36vw, 560px)); }
        .main-card { background: var(--card); border-radius: clamp(35px, 2.4vw, 40px); padding: clamp(25px, 2.2vw, 32px); box-shadow: 0 15px 40px rgba(0,0,0,0.06); text-align: center; }
        
        .header h1 { font-size: clamp(1.6rem, 1.45vw, 1.9rem); color: #333; margin: 0; font-weight: 800; letter-spacing: -1px; }
        .header p { font-size: clamp(0.9rem, 0.9vw, 1rem); color: #666; margin: 5px 0 clamp(25px, 1.8vw, 30px); font-weight: 700; opacity: 0.8; }
        .header-actions { display: flex; justify-content: center; gap: 8px; margin: -14px 0 18px; }
        .utility-btn, .share-meal-btn { min-height: 40px; border: 1px solid #E4EAF0; border-radius: 12px; padding: 8px 12px; background: #FFF; color: #52606D; cursor: pointer; font-size: 0.78rem; font-weight: 800; }
        .utility-btn:hover, .share-meal-btn:hover { border-color: #B9C9D8; background: #F8FBFE; }

        .date-box { margin-bottom: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .date-label { font-size: 0.8rem; color: #888; font-weight: 600; }
        .date-controls { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .date-picker-shell { position: relative; width: min(66%, 220px); min-height: 44px; border: 2px solid #EEE; border-radius: 50px; background: #FDFDFD; cursor: pointer; transition: 0.2s; }
        .date-picker-shell:hover { border-color: #C9D5E2; background: #FFF; box-shadow: 0 2px 6px rgba(15,23,42,0.05); }
        .date-picker-shell:active { background: #F5F8FB; }
        .date-picker-shell:focus, .date-picker-shell:focus-within { outline: 3px solid rgba(33,150,243,0.35); outline-offset: 2px; }
        .compact-date-label { display: grid; place-items: center; min-height: 40px; color: #555; font-size: 0.96rem; font-weight: 800; letter-spacing: 0.04em; pointer-events: none; }
        .date-nav-btn {
            background: #fff; border: 2px solid #EEE; border-radius: 50%;
            width: 44px; height: 44px; cursor: pointer; font-size: 0.8rem;
            color: #999; display: flex; align-items: center; justify-content: center;
            transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); flex-shrink: 0;
        }
        .date-nav-btn:hover { background: #f0f0f0; color: var(--secondary); border-color: var(--secondary); }
        .today-btn { min-height: 38px; border: 0; border-radius: 999px; padding: 7px 13px; background: #333; color: #FFF; cursor: pointer; font-size: 0.78rem; font-weight: 800; }
        .date-picker-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; }

        .tab-switch { display: flex; background: #EEE; border-radius: 20px; padding: 5px; margin-bottom: 20px; gap: 3px; }
        .tab-item { flex: 1; min-height: 44px; padding: 10px 5px; border: 0; background: transparent; cursor: pointer; border-radius: 16px; font-weight: 700; color: #777; transition: 0.3s; font-size: 0.85rem; }
        .tab-item.active.lunch { background: var(--primary); color: white; }
        .tab-item.active.dinner { background: var(--secondary); color: white; }
        .tab-item.active.suggest { background: var(--info); color: white; }

        #yesterday-winner-box {
            background: linear-gradient(to right, #FFF9E1, #FFF2CC);
            border: 1px solid #FFE599; border-radius: 15px;
            padding: 10px; margin-bottom: 15px; font-size: 0.85rem; font-weight: 700;
            color: #856404; display: none;
        }

        .meal-content-area {
            background: #FAFAFA; border-radius: 25px; padding: clamp(25px, 2.1vw, 32px) clamp(20px, 2vw, 28px); min-height: 150px;
            border: 1px solid #F0F0F0; transition: 0.3s; position: relative; margin-bottom: 20px;
        }
        .meal-content-area.lunch { background: var(--primary-light); border-color: #C8E6C9; }
        .meal-content-area.dinner { background: var(--secondary-light); border-color: #FFE0B2; }
        
        .meal-label-row { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 15px; }
        .meal-status-label { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; }
        .lunch .meal-status-label { background: var(--primary); color: white; }
        .dinner .meal-status-label { background: var(--secondary); color: white; }
        .average-rating { display: inline-flex; align-items: baseline; gap: 5px; color: #777; white-space: nowrap; }
        .average-rating-value { font-size: 0.88rem; font-weight: 800; }
        .rating-count { font-size: 0.72rem; font-weight: 600; color: #999; }

        @keyframes special-glow {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(255,152,0,0.3); }
            50% { transform: scale(1.03); box-shadow: 0 0 25px rgba(255,152,0,0.6); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(255,152,0,0.3); }
        }
        .special-meal-card { animation: special-glow 2s infinite ease-in-out; border: 4px solid #FF9800 !important; background: #FFFDF0 !important; }
        .special-meal-card .meal-status-label { 
            font-size: 1.2rem !important; padding: 8px 18px !important; 
            background: linear-gradient(45deg, #FF5252, #FF9800) !important;
            box-shadow: 0 5px 15px rgba(255,82,82,0.3); margin-bottom: 20px;
            border-radius: 15px !important; font-weight: 900 !important;
        }

        .menu-text { line-height: 2.0; color: #444; font-size: clamp(1.15rem, 1.1vw, 1.3rem); font-weight: 700; word-break: keep-all; overflow-wrap: break-word; letter-spacing: -0.2px; }
        .menu-detail { display: block; color: #888; font-size: 0.85rem; font-weight: 500; }
        .meal-card-actions { display: flex; justify-content: flex-end; margin-top: 14px; }
        .share-meal-btn { min-height: 36px; padding: 6px 11px; font-size: 0.75rem; background: rgba(255,255,255,0.65); }
        .meal-state-detail { display: block; color: #888; font-size: 0.78rem; font-weight: 500; line-height: 1.5; margin-top: 6px; }
        .retry-btn {
            border: none; border-radius: 14px; margin-top: 14px; padding: 9px 15px; min-height: 44px;
            background: #333; color: #FFF; cursor: pointer; font-weight: 700;
        }
        .skeleton { display: grid; gap: 10px; padding: 8px 5px; }
        .skeleton-line { height: 18px; border-radius: 10px; background: linear-gradient(90deg, #E9ECEF 25%, #F8F9FA 50%, #E9ECEF 75%); background-size: 200% 100%; animation: skeleton-wave 1.4s infinite; }
        .skeleton-line:nth-child(2) { width: 82%; margin-inline: auto; }
        .skeleton-line:nth-child(3) { width: 68%; margin-inline: auto; }
        @keyframes skeleton-wave { to { background-position: -200% 0; } }

        .rating-panel { border-top: 1px dashed #DDD; padding-top: 15px; margin-bottom: 20px; }
        .star-radio-group { display: flex; justify-content: center; flex-direction: row-reverse; gap: 3px; margin-bottom: 6px; }
        .star-radio-group.disabled { opacity: 0.78; }
        .star-radio-group input { position: absolute; opacity: 0; pointer-events: none; }
        .star-radio-group label { display: grid; place-items: center; min-width: 44px; min-height: 44px; font-size: 2rem; color: #DDD; cursor: pointer; transition: 0.2s; }
        .star-radio-group label:hover, .star-radio-group label:hover ~ label,
        .star-radio-group input:checked ~ label { color: #FFC107; }
        .star-radio-group input:focus-visible + label { outline: 3px solid rgba(33,150,243,0.35); border-radius: 10px; }
        .rating-selection { margin: 0; min-height: 20px; color: #8A6D00; font-size: 0.78rem; font-weight: 700; }
        .rating-actions { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
        .rating-actions[hidden] { display: none; }
        .rating-action-btn { min-height: 40px; padding: 8px 14px; border: 0; border-radius: 12px; cursor: pointer; font-size: 0.8rem; font-weight: 800; }
        .rating-edit-btn { background: #FFF3E0; color: #C76700; }
        .rating-cancel-btn { background: #FFF0F0; color: #C62828; }
        .rating-back-btn { background: #EEF0F3; color: #555; }

        .poll-section { margin-top: 25px; text-align: left; background: #FDFDFD; padding: 20px; border-radius: 20px; border: 1px solid #EEE; }
        .poll-section h3 { font-size: 1rem; color: #333; margin-bottom: 12px; font-weight: 800; }
        .poll-item-row { width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; color: #333; background: #F9F9F9; padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #F0F0F0; cursor: pointer; font-size: 0.95rem; font-weight: 600; }
        .poll-item-row.selected { background: #E3F2FD; border-color: #64B5F6; box-shadow: inset 0 0 0 1px #64B5F6; }

        .comments-section { text-align: left; margin-top: 30px; }
        .comment-input-row { display: flex; gap: 8px; margin-bottom: 18px; }
        .comment-input-row input { min-width: 0; min-height: 44px; flex: 1; padding: 12px 18px; border-radius: 15px; border: 2px solid #EEE; outline: none; font-size: 0.9rem; }
        .comment-input-row button { min-width: 64px; min-height: 44px; background: #333; color: white; border: none; padding: 0 18px; border-radius: 15px; cursor: pointer; font-weight: 700; }

        .comment-bubble { background: #FFF; padding: 15px; border-radius: 20px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); border: 1px solid #F0F0F0; position: relative; }
        .comment-text { font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; color: #444; }
        .comment-meta { font-size: 0.7rem; color: #AAA; display: flex; align-items: center; gap: 10px; }
        .suggestion-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 15px; }
        .suggestion-header h3 { margin: 0; }
        .admin-login-btn, .suggestion-delete-btn { min-height: 36px; border: 0; border-radius: 10px; cursor: pointer; font-size: 0.75rem; font-weight: 800; }
        .admin-login-btn { padding: 7px 10px; background: #EEF6FF; color: #1565C0; }
        .admin-login-btn.admin-active { background: #E8F5E9; color: #2E7D32; }
        .suggestion-delete-btn { margin-left: auto; padding: 6px 10px; background: #FFF0F0; color: #C62828; }
        .suggestion-notice { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: #F3F9FF; color: #49627A; font-size: 0.76rem; font-weight: 600; line-height: 1.5; }
        .suggestion-name-row { margin-bottom: 8px; }
        .like-badge { min-height: 36px; cursor: pointer; border: none; background: rgba(255,82,82,0.1); color: var(--like); padding: 6px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; }
        .scroll-area { max-height: 300px; overflow-y: auto; padding-right: 5px; }
        .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 1000; width: min(calc(100% - 32px), 390px); padding: 13px 16px; border-radius: 14px; background: #333; color: #FFF; box-shadow: 0 10px 30px rgba(0,0,0,0.2); font-size: 0.9rem; font-weight: 700; text-align: center; opacity: 0; transform: translate(-50%, 16px); pointer-events: none; transition: 0.25s; }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }
        .toast.error { background: #C62828; }
        .toast.info { background: #1565C0; }
        .modal-backdrop { position: fixed; inset: 0; z-index: 1100; display: grid; place-items: center; padding: 20px; background: rgba(15,23,42,0.48); }
        .modal-backdrop[hidden] { display: none; }
        .confirm-dialog { width: min(100%, 360px); padding: 24px; border-radius: 22px; background: #FFF; box-shadow: 0 20px 60px rgba(0,0,0,0.22); text-align: center; }
        .confirm-dialog h2 { margin: 0 0 8px; font-size: 1.15rem; }
        .confirm-dialog p { margin: 0 0 20px; color: #555; line-height: 1.5; overflow-wrap: anywhere; }
        .modal-actions { display: flex; gap: 8px; }
        .modal-actions button { flex: 1; min-height: 44px; border: 0; border-radius: 12px; cursor: pointer; font-weight: 800; }
        .modal-cancel { background: #EEF0F3; color: #555; }
        .modal-confirm { background: var(--info); color: #FFF; }
        .feature-dialog { width: min(100%, 440px); max-height: min(78vh, 680px); display: flex; flex-direction: column; padding: 20px; border-radius: 22px; background: #FFF; box-shadow: 0 20px 60px rgba(0,0,0,0.22); }
        .feature-dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
        .feature-dialog-header h2 { margin: 0; font-size: 1.12rem; }
        .feature-close-btn { width: 36px; min-height: 36px; border: 0; border-radius: 50%; background: #F1F3F5; color: #667085; cursor: pointer; font-size: 1.1rem; }
        .feature-content { min-height: 0; overflow-y: auto; text-align: left; }
        .search-form { display: flex; gap: 8px; margin-bottom: 12px; }
        .search-form input { min-width: 0; min-height: 44px; flex: 1; border: 2px solid #E9EDF1; border-radius: 13px; padding: 10px 12px; }
        .search-form button { min-width: 66px; min-height: 44px; border: 0; border-radius: 13px; background: var(--info); color: #FFF; cursor: pointer; font-weight: 800; }
        .feature-help, .feature-empty { margin: 0; color: #7B8794; font-size: 0.8rem; line-height: 1.55; }
        .search-result-list, .stats-grid { display: grid; gap: 9px; }
        .search-result { width: 100%; border: 1px solid #EAECEF; border-radius: 14px; padding: 12px; background: #FFF; cursor: pointer; text-align: left; }
        .search-result:hover { border-color: #9BC8EE; background: #F6FBFF; }
        .search-result-date { display: block; color: var(--info); font-size: 0.76rem; font-weight: 800; margin-bottom: 5px; }
        .search-result-menu { display: block; color: #3E4A56; font-size: 0.88rem; font-weight: 700; line-height: 1.55; overflow-wrap: anywhere; }
        .stats-month { margin: 0 0 12px; color: #6B7785; font-size: 0.82rem; font-weight: 700; }
        .stat-card { border: 1px solid #EAECEF; border-radius: 15px; padding: 13px; background: #FCFDFE; }
        .stat-card-label { display: block; color: #788694; font-size: 0.75rem; font-weight: 700; margin-bottom: 5px; }
        .stat-card-value { display: block; color: #374151; font-size: 1rem; font-weight: 800; line-height: 1.45; overflow-wrap: anywhere; }
        .stat-card-detail { display: block; color: #8895A2; font-size: 0.76rem; font-weight: 600; margin-top: 3px; }
        footer { margin-top: 25px; font-size: 0.75rem; color: #BBB; text-align: center; padding-bottom: 15px; }

        @media (max-width: 600px) {
            body { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: env(safe-area-inset-bottom); }
            .app-container { width: calc(100% - 16px); }
            .main-card { border-radius: 26px; padding: 20px 16px; }
            .navigation-panel { position: sticky; top: max(0px, env(safe-area-inset-top)); z-index: 20; margin: 0 -8px 16px; padding: 8px; border-radius: 20px; background: rgba(255,255,255,0.96); box-shadow: 0 8px 20px rgba(15,23,42,0.07); backdrop-filter: blur(10px); }
            .date-box, .tab-switch { margin-bottom: 10px; }
            .tab-switch { margin-bottom: 0; }
            .menu-text { font-size: clamp(0.98rem, 4.3vw, 1.12rem); line-height: 1.85; word-break: normal; overflow-wrap: anywhere; }
            .comment-text, .poll-item-row span { overflow-wrap: anywhere; word-break: normal; }
            .rating-actions { width: 100%; }
            .rating-action-btn { flex: 1; }
            .feature-dialog { width: min(100%, 400px); max-height: 82vh; padding: 18px; border-radius: 20px; }
        }

        @media (min-width: 1200px) {
            .date-nav-btn { width: 48px; height: 48px; font-size: 0.88rem; }
            .date-picker-shell { width: min(66%, 240px); min-height: 46px; }
            .compact-date-label { min-height: 42px; font-size: 1rem; }
            .today-btn { min-height: 42px; padding: 8px 16px; font-size: 0.84rem; }
            .tab-switch { padding: 6px; margin-bottom: 24px; }
            .tab-item { min-height: 48px; padding: 11px 7px; border-radius: 17px; font-size: 0.92rem; }
            .meal-label-row { margin-bottom: 18px; }
            .meal-status-label { padding: 6px 14px; font-size: 0.82rem; }
            .average-rating-value { font-size: 0.96rem; }
            .rating-count { font-size: 0.78rem; }
            .rating-panel { padding-top: 18px; margin-bottom: 24px; }
            .star-radio-group label { min-width: 48px; min-height: 48px; font-size: 2.2rem; }
            .rating-action-btn { min-height: 44px; padding: 9px 17px; border-radius: 14px; font-size: 0.86rem; }
            .poll-section { margin-top: 28px; padding: 24px; border-radius: 22px; }
            .poll-section h3 { font-size: 1.08rem; }
            .poll-item-row { min-height: 52px; padding: 13px 14px; border-radius: 14px; font-size: 1rem; }
            .comments-section { margin-top: 34px; }
            .comment-input-row { gap: 10px; margin-bottom: 20px; }
            .comment-input-row input { min-height: 48px; padding: 13px 20px; border-radius: 16px; font-size: 0.96rem; }
            .comment-input-row button { min-width: 70px; min-height: 48px; padding: 0 20px; border-radius: 16px; }
            .comment-bubble { padding: 18px; border-radius: 22px; margin-bottom: 12px; }
            .comment-text { font-size: 1rem; }
            .suggestion-notice { padding: 12px 14px; font-size: 0.82rem; }
            .scroll-area { max-height: 340px; }
            .utility-btn { min-height: 42px; padding: 9px 14px; font-size: 0.82rem; }
            .share-meal-btn { min-height: 40px; padding: 7px 13px; font-size: 0.8rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="main-card">
            <div class="header">
                <h1>🍱 배정고 오늘의 급식!</h1>
                <p>현정T가 만들었음.</p>
            </div>
            <div class="header-actions" aria-label="급식 도구">
                <button type="button" class="utility-btn" onclick="openMenuSearch()">🔎 메뉴 검색</button>
                <button type="button" class="utility-btn" onclick="openMonthlyStats()">📊 통계</button>
            </div>

            <div class="navigation-panel">
                <div class="date-box">
                    <span class="date-label">다른 날짜 메뉴 확인 📅</span>
                    <div class="date-controls">
                        <button type="button" onclick="changeDate(-1)" class="date-nav-btn" aria-label="이전 날짜">◀</button>
                        <div class="date-picker-shell" role="button" tabindex="0" aria-label="급식 날짜 선택" onclick="openDatePicker()" onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openDatePicker(); }">
                            <span id="compact-date-label" class="compact-date-label">날짜 선택</span>
                            <input type="date" id="date-selector" class="date-picker-input" onchange="updateUI()" aria-label="급식 날짜 선택">
                        </div>
                        <button type="button" onclick="changeDate(1)" class="date-nav-btn" aria-label="다음 날짜">▶</button>
                    </div>
                    <button type="button" id="today-button" class="today-btn" onclick="goToday()" hidden>오늘로 이동</button>
                </div>

                <div class="tab-switch" role="tablist" aria-label="급식 종류 선택">
                    <button type="button" role="tab" aria-selected="true" id="tab-lunch" class="tab-item active lunch" onclick="changeTab('lunch')">☀️ 점심</button>
                    <button type="button" role="tab" aria-selected="false" id="tab-dinner" class="tab-item dinner" onclick="changeTab('dinner')">🌙 저녁</button>
                    <button type="button" role="tab" aria-selected="false" id="tab-suggest" class="tab-item suggest" onclick="changeTab('suggest')">💡 건의함</button>
                </div>
            </div>

            <div id="yesterday-winner-box">👑 어제 우리가 뽑은 기대 메뉴 1위: 로딩 중...</div>

            <div id="meal-view-container">
                <div id="meal-card" class="meal-content-area lunch">
                    <div class="meal-label-row">
                        <div class="meal-status-label" id="meal-status">오늘의 점심</div>
                        <div id="avg-rating-display" class="average-rating" aria-live="polite">
                            <span id="average-rating-value" class="average-rating-value">아직 평가 없음</span>
                            <span id="rating-count" class="rating-count"></span>
                        </div>
                    </div>
                    <div class="menu-text" id="menu-content" aria-live="polite">식단 로딩 중...</div>
                    <div class="meal-card-actions">
                        <button type="button" class="share-meal-btn" onclick="shareCurrentMeal()">↗ 공유</button>
                    </div>
                </div>

                <div class="rating-panel">

        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');

            toast.textContent = message;

            toastTimer = setTimeout(() => { toast.className = 'toast'; }, 2800);

        function showConfirm(message, title = "확인", confirmText = "확인", cancelText = "돌아가기") {
            const modal = document.getElementById('confirm-modal');
            const titleElement = document.getElementById('confirm-title');
            const messageElement = document.getElementById('confirm-message');
            const confirmButton = document.getElementById('confirm-ok');
            const cancelButton = document.getElementById('confirm-cancel');
            titleElement.textContent = title;
            messageElement.textContent = message;
            confirmButton.textContent = confirmText;
            cancelButton.textContent = cancelText;
            modal.hidden = false;
            confirmButton.focus();

            return new Promise(resolve => {
                const close = result => {
                    modal.hidden = true;
                    confirmButton.removeEventListener('click', onConfirm);
                    cancelButton.removeEventListener('click', onCancel);
                    modal.removeEventListener('click', onBackdrop);
                    document.removeEventListener('keydown', onKeydown);
                    resolve(result);
                };
                const onConfirm = () => close(true);
                const onCancel = () => close(false);
                const onBackdrop = event => { if (event.target === modal) close(false); };
                const onKeydown = event => { if (event.key === 'Escape') close(false); };
                confirmButton.addEventListener('click', onConfirm);
                cancelButton.addEventListener('click', onCancel);
                modal.addEventListener('click', onBackdrop);
                document.addEventListener('keydown', onKeydown);
            });
        }

        function parseSafeDate(dateStr) {
            if (!dateStr) return new Date();
            const parts = dateStr.split('-');

        function getCachedMeals(cacheKey) {
            try {
                const cached = JSON.parse(sessionStorage.getItem(`${MEAL_CACHE_PREFIX}${cacheKey}`));
                if (!cached || cached.expiresAt < Date.now()) return null;
                return cached.rows;
            } catch {
                return null;
            }
        }

        function cacheMeals(cacheKey, rows) {
            try {
                sessionStorage.setItem(`${MEAL_CACHE_PREFIX}${cacheKey}`, JSON.stringify({
                    expiresAt: Date.now() + MEAL_CACHE_TTL,
                    rows
                }));
            } catch (error) {
                console.warn("급식 캐시 저장 실패:", error);
            }
        }

        async function fetchJsonWithRetry(url, externalSignal, retries = 1, timeoutMs = 8000) {
            let lastError;
            for (let attempt = 0; attempt <= retries; attempt += 1) {
                if (externalSignal.aborted) throw new DOMException("요청이 취소되었습니다.", "AbortError");
                const attemptController = new AbortController();
                const abortAttempt = () => attemptController.abort();
                externalSignal.addEventListener('abort', abortAttempt, { once: true });
                let timedOut = false;
                const timeoutId = setTimeout(() => {
                    timedOut = true;
                    attemptController.abort();
                }, timeoutMs);
                try {
                    const response = await fetch(url, { signal: attemptController.signal });
                    if (!response.ok) {
                        const httpError = new Error(`급식 정보 요청 실패 (${response.status})`);
                        httpError.retryable = response.status === 429 || response.status >= 500;
                        throw httpError;
                    }
                    return await response.json();
                } catch (error) {
                    if (externalSignal.aborted) throw new DOMException("요청이 취소되었습니다.", "AbortError");
                    lastError = timedOut ? new Error("급식 정보 요청 시간이 초과되었습니다.") : error;
                    const retryable = timedOut || error instanceof TypeError || error.retryable;
                    if (attempt === retries || !retryable) throw lastError;
                } finally {
                    clearTimeout(timeoutId);
                    externalSignal.removeEventListener('abort', abortAttempt);
                }
            }
            throw lastError;
        }

        function applyMealRows(rows, days) {
            days.forEach(day => {
                const ymd = `${day.getFullYear()}${String(day.getMonth() + 1).padStart(2, '0')}${String(day.getDate()).padStart(2, '0')}`;
                const dateKey = `${ymd.substring(0,4)}-${ymd.substring(4,6)}-${ymd.substring(6,8)}`;
                delete lunchData[dateKey];
                delete dinnerData[dateKey];
            });

            rows.forEach(row => {
                const ymd = row.MLSV_YMD;
                const hyphenDate = `${ymd.substring(0,4)}-${ymd.substring(4,6)}-${ymd.substring(6,8)}`;
                const menuClean = row.DDISH_NM
                    .replace(/<br\s*\/?>/gi, ',')
                    .replace(/\([\d\.]+\)/g, '')
                    .replace(/\s+/g, ' ')
                    .trim();

                if (row.MMEAL_SC_CODE === "2") lunchData[hyphenDate] = menuClean;
                if (row.MMEAL_SC_CODE === "3") dinnerData[hyphenDate] = menuClean;
            });
        }

        async function fetchNeisMeals(centerDateStr) {
            if (activeMealController) activeMealController.abort();
            const requestController = new AbortController();
            activeMealController = requestController;

            const centerDate = parseSafeDate(centerDateStr);
            const yesterday = new Date(centerDate); yesterday.setDate(yesterday.getDate() - 1);
            const tomorrow = new Date(centerDate); tomorrow.setDate(tomorrow.getDate() + 1);

            const formatDate = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
            const fromYmd = formatDate(yesterday);
            const toYmd = formatDate(tomorrow);
            const cacheKey = `${fromYmd}-${toYmd}`;
            const cachedRows = getCachedMeals(cacheKey);

            if (cachedRows) {
                applyMealRows(cachedRows, [yesterday, centerDate, tomorrow]);
                if (activeMealController === requestController) activeMealController = null;
                return { ok: true, source: 'cache' };
            }

            const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&KEY=${NEIS_API_KEY}&ATPT_OFCDC_SC_CODE=${OFFICE_CODE}&SD_SCHUL_CODE=${SCHOOL_CODE}&MLSV_FROM_YMD=${fromYmd}&MLSV_TO_YMD=${toYmd}`;

            try {
                const data = await fetchJsonWithRetry(url, requestController.signal);
                const apiResult = data.RESULT || data.mealServiceDietInfo?.[0]?.head?.find(item => item.RESULT)?.RESULT;
                if (apiResult && !["INFO-000", "INFO-200"].includes(apiResult.CODE)) {
                    return { ok: false, type: 'api', error: new Error(apiResult.MESSAGE || "나이스 API 오류") };
                }

                const rows = data.mealServiceDietInfo?.[1]?.row || [];
                applyMealRows(rows, [yesterday, centerDate, tomorrow]);
                cacheMeals(cacheKey, rows);
                return { ok: true, source: 'network' };
            } catch (e) {
                if (e.name === 'AbortError') return { ok: false, aborted: true, error: e };
                console.error("나이스 API 통신 오류:", e);
                return { ok: false, type: 'network', error: e };
            } finally {
                if (activeMealController === requestController) activeMealController = null;
            }
        }

        function filterMenuItems(menuStr) {
            if(!menuStr) return [];
            return menuStr.split(/,(?![^(]*\))/).map(s=>s.trim()).filter(item => {
                if (item === "") return false;
                const baseName = item.replace(/\([^)]*\)/g, '').trim();
                if (baseName.endsWith('밥')) return false;
                if (baseName.endsWith('김치') || baseName === '김치') return false;
                const skipSides = ["깍두기", "석박지", "단무지", "맛김", "김자반", "쌈장", "마늘", "소스"];
                if (skipSides.includes(baseName)) return false;
                return true;
            });
        }

        function formatDateKey(date) {

            return `${date.getFullYear()}${String(date.getMonth() + 1).padStart(2, '0')}${String(date.getDate()).padStart(2, '0')}`;

        function getPollMealMap(rows) {
            const meals = {};
            rows.forEach(row => {
                const ymd = row.MLSV_YMD;
                const date = `${ymd.substring(0, 4)}-${ymd.substring(4, 6)}-${ymd.substring(6, 8)}`;
                const mealType = row.MMEAL_SC_CODE === '2' ? 'lunch' : (row.MMEAL_SC_CODE === '3' ? 'dinner' : null);
                if (!mealType) return;
                meals[`${date}_${mealType}`] = row.DDISH_NM
                    .replace(/<br\s*\/?>/gi, ',')
                    .replace(/\([\d\.]+\)/g, '')
                    .replace(/\s+/g, ' ')
                    .trim();
            });
            return meals;
        }

        function findNextPollMeal(meals, now = new Date()) {
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const startOffset = now.getHours() >= 19 ? 1 : 0;

            for (let offset = startOffset; offset < NEXT_MEAL_SEARCH_DAYS; offset += 1) {
                const date = new Date(today);
                date.setDate(today.getDate() + offset);
                const mealTypes = offset === 0 ? ['dinner'] : ['lunch', 'dinner'];
                for (const mealType of mealTypes) {
                    const dateKey = formatDateKey(date);
                    const menu = meals[`${dateKey}_${mealType}`];
                    if (menu) return { date: dateKey, mealType, menu };
                }
            }
            return null;
        }

        function getPollTargetLabel(target, now = new Date()) {
            const targetDate = parseSafeDate(target.date);
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const diffDays = Math.round((targetDate - today) / 86400000);
            const mealName = target.mealType === 'lunch' ? '점심' : '저녁';
            if (diffDays === 0) return `오늘 ${mealName}`;
            if (diffDays === 1) return `내일 ${mealName}`;
            return `${targetDate.getMonth() + 1}월 ${targetDate.getDate()}일 ${mealName}`;
        }

        async function fetchPollMealRows(now) {
            const fromDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const toDate = new Date(fromDate);
            toDate.setDate(toDate.getDate() + NEXT_MEAL_SEARCH_DAYS - 1);
            const cacheKey = `poll-${formatNeisDate(fromDate)}-${formatNeisDate(toDate)}`;
            const cachedRows = getCachedMeals(cacheKey);
            if (cachedRows) return cachedRows;

            const controller = new AbortController();
            const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&KEY=${NEIS_API_KEY}&ATPT_OFCDC_SC_CODE=${OFFICE_CODE}&SD_SCHUL_CODE=${SCHOOL_CODE}&MLSV_FROM_YMD=${formatNeisDate(fromDate)}&MLSV_TO_YMD=${formatNeisDate(toDate)}`;
            const data = await fetchJsonWithRetry(url, controller.signal);
            const apiResult = data.RESULT || data.mealServiceDietInfo?.[0]?.head?.find(item => item.RESULT)?.RESULT;
            if (apiResult && !['INFO-000', 'INFO-200'].includes(apiResult.CODE)) {
                throw new Error(apiResult.MESSAGE || '나이스 API 오류');
            }
            const rows = data.mealServiceDietInfo?.[1]?.row || [];
            cacheMeals(cacheKey, rows);
            return rows;
        }

        async function fetchNeisMealRange(fromDate, toDate, cacheName) {
            const fromYmd = formatNeisDate(fromDate);
            const toYmd = formatNeisDate(toDate);
            const cacheKey = `${cacheName}-${fromYmd}-${toYmd}`;
            const cachedRows = getCachedMeals(cacheKey);
            if (cachedRows) return cachedRows;

            const controller = new AbortController();
            const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&KEY=${NEIS_API_KEY}&ATPT_OFCDC_SC_CODE=${OFFICE_CODE}&SD_SCHUL_CODE=${SCHOOL_CODE}&MLSV_FROM_YMD=${fromYmd}&MLSV_TO_YMD=${toYmd}`;
            const data = await fetchJsonWithRetry(url, controller.signal);
            const apiResult = data.RESULT || data.mealServiceDietInfo?.[0]?.head?.find(item => item.RESULT)?.RESULT;
            if (apiResult && !['INFO-000', 'INFO-200'].includes(apiResult.CODE)) {
                throw new Error(apiResult.MESSAGE || '나이스 API 오류');
            }
            const rows = data.mealServiceDietInfo?.[1]?.row || [];
            cacheMeals(cacheKey, rows);
            return rows;
        }

        function formatMealType(mealType) {
            return mealType === 'dinner' ? '저녁' : '점심';
        }

        function getMealTypeFromRow(row) {
            return row.MMEAL_SC_CODE === '2' ? 'lunch' : (row.MMEAL_SC_CODE === '3' ? 'dinner' : null);
        }

        function getMealDateFromRow(row) {
            const ymd = row.MLSV_YMD;
            return `${ymd.substring(0, 4)}-${ymd.substring(4, 6)}-${ymd.substring(6, 8)}`;
        }

        function cleanMealMenu(menu) {
            return (menu || '').replace(/<br\s*\/?>/gi, ',').replace(/\s+/g, ' ').trim();
        }

        function formatMealDate(date) {
            const parsed = parseSafeDate(date);
            return `${parsed.getFullYear()}.${String(parsed.getMonth() + 1).padStart(2, '0')}.${String(parsed.getDate()).padStart(2, '0')}.`;
        }

        async function searchMenus(rawQuery, year) {
            const query = rawQuery.trim();
            const content = document.getElementById('feature-content');
            const oldResults = content.querySelector('.search-result-list, .feature-empty');
            if (oldResults) oldResults.remove();
            content.querySelectorAll('[data-feature-loading]').forEach(element => element.remove());
            if (!query) {
                addFeatureMessage('찾을 메뉴명을 입력해 주세요.', 'feature-empty');
                return;
            }

            const loading = addFeatureMessage('급식표에서 메뉴를 찾는 중이에요…', 'feature-help');
            loading.dataset.featureLoading = 'true';
            const requestId = ++featureLoadSequence;
            try {
                const rows = await fetchNeisMealRange(new Date(year, 0, 1), new Date(year, 11, 31), 'menu-search');
                if (requestId !== featureLoadSequence) { loading.remove(); return; }
                loading.remove();
                const normalizedQuery = query.toLocaleLowerCase('ko-KR');
                const results = rows.map(row => ({
                    date: getMealDateFromRow(row),
                    mealType: getMealTypeFromRow(row),
                    menu: cleanMealMenu(row.DDISH_NM)
                })).filter(item => item.mealType && item.menu.toLocaleLowerCase('ko-KR').includes(normalizedQuery))
                    .sort((a, b) => a.date.localeCompare(b.date) || a.mealType.localeCompare(b.mealType));

                if (results.length === 0) {
                    addFeatureMessage('해당 메뉴가 포함된 급식을 찾지 못했어요.', 'feature-empty');
                    return;
                }

                const list = document.createElement('div');
                list.className = 'search-result-list';
                results.forEach(result => {
                    const resultButton = document.createElement('button');
                    resultButton.type = 'button';
                    resultButton.className = 'search-result';
                    const date = document.createElement('span');
                    date.className = 'search-result-date';
                    date.textContent = `${formatMealDate(result.date)} ${formatMealType(result.mealType)}`;
                    const menu = document.createElement('span');
                    menu.className = 'search-result-menu';
                    menu.textContent = result.menu;
                    resultButton.append(date, menu);
                    resultButton.addEventListener('click', () => {
                        closeFeatureModal();
                        dateInput.value = result.date;
                        changeTab(result.mealType);
                    });
                    list.appendChild(resultButton);
                });
                content.appendChild(list);
            } catch (error) {
                if (requestId !== featureLoadSequence) { loading.remove(); return; }
                console.error('메뉴 검색용 급식 조회 실패:', error);
                loading.textContent = '메뉴 검색에 필요한 급식표를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
                loading.className = 'feature-empty';
            }
        }

        function getRatingSummary(rating) {
            const userRatings = Object.values(rating?.users || {}).filter(item => item?.active);
            return {
                totalScore: (Number(rating?.totalScore) || 0) + userRatings.reduce((sum, item) => sum + Number(item.score || 0), 0),
                count: (Number(rating?.voterCount) || 0) + userRatings.length
            };
        }

        function addStatCard(grid, label, value, detail = '') {
            const card = document.createElement('div');

        function formatStatMeal(meal) {
            const date = parseSafeDate(meal.date);
            return `${date.getMonth() + 1}월 ${date.getDate()}일 ${formatMealType(meal.mealType)}`;
        }

        function formatTiedMeals(meals, suffix) {
            const labels = meals.slice(0, 2).map(formatStatMeal).join(' · ');
            const more = meals.length > 2 ? ` 외 ${meals.length - 2}건` : '';
            return `${meals.length > 1 ? '공동 1위 · ' : ''}${labels}${more}${suffix}`;
        }

            content.appendChild(month);

        async function loadMonthlyStats(selectedDate, loading) {
            const requestId = ++featureLoadSequence;
            const year = selectedDate.getFullYear();
            const month = selectedDate.getMonth();
            const start = new Date(year, month, 1);
            const end = new Date(year, month + 1, 0);
            try {
                const rows = await fetchNeisMealRange(start, end, 'monthly-stats');
                const meals = rows.map(row => ({
                    date: getMealDateFromRow(row), mealType: getMealTypeFromRow(row), menu: cleanMealMenu(row.DDISH_NM)
                })).filter(meal => meal.mealType);
                const data = await Promise.all(meals.map(async meal => {
                    try {
                        const [ratingSnapshot, pollSnapshot] = await Promise.all([
                            database.ref(`meals/${meal.date}/${meal.mealType}/rating`).once('value'),
                            database.ref(`polls/${meal.date}/${meal.mealType}`).once('value')
                        ]);
                        return { ...meal, rating: getRatingSummary(ratingSnapshot.val()), votes: pollSnapshot.val() || {} };
                    } catch (error) {
                        console.warn('월간 통계 항목 조회 실패:', meal.date, meal.mealType, error);
                        return { ...meal, rating: { totalScore: 0, count: 0 }, votes: {} };
                    }
                }));
                if (requestId !== featureLoadSequence) { loading.remove(); return; }
                loading.remove();
                renderMonthlyStats(data);
            } catch (error) {
                if (requestId !== featureLoadSequence) { loading.remove(); return; }
                console.error('월간 통계 조회 실패:', error);
                loading.textContent = '월간 통계를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
                loading.className = 'feature-empty';
            }
        }

        function renderMonthlyStats(meals) {
            const grid = document.createElement('div');
            grid.className = 'stats-grid';
            const evaluated = meals.filter(meal => meal.rating.count > 0);
            const totalScore = evaluated.reduce((sum, meal) => sum + meal.rating.totalScore, 0);
            const totalCount = evaluated.reduce((sum, meal) => sum + meal.rating.count, 0);
            addStatCard(grid, '이번 달 전체 평균 별점', totalCount ? `★ ${(totalScore / totalCount).toFixed(1)}` : '아직 평가 없음', totalCount ? `누적 평가 ${totalCount}건` : '평가가 등록되면 표시돼요.');

            ['lunch', 'dinner'].forEach(mealType => {
                const typeMeals = evaluated.filter(meal => meal.mealType === mealType);
                const score = typeMeals.reduce((sum, meal) => sum + meal.rating.totalScore, 0);
                const count = typeMeals.reduce((sum, meal) => sum + meal.rating.count, 0);
                addStatCard(grid, `${formatMealType(mealType)} 평균 별점`, count ? `★ ${(score / count).toFixed(1)}` : '아직 평가 없음', count ? `누적 평가 ${count}건` : '');
            });

            if (evaluated.length) {
                const highestAverage = Math.max(...evaluated.map(meal => meal.rating.totalScore / meal.rating.count));
                const highestMeals = evaluated.filter(meal => Math.abs((meal.rating.totalScore / meal.rating.count) - highestAverage) < 0.0001);
                addStatCard(grid, '🏆 최고 평점 급식', formatTiedMeals(highestMeals, ` · ★ ${highestAverage.toFixed(1)}`));
                const mostCount = Math.max(...evaluated.map(meal => meal.rating.count));
                const mostRatedMeals = evaluated.filter(meal => meal.rating.count === mostCount);
                addStatCard(grid, '🙌 가장 많은 평가를 받은 급식', formatTiedMeals(mostRatedMeals, ` · ${mostCount}건`));
            } else {
                addStatCard(grid, '🏆 최고 평점 급식', '아직 평가 없음');
                addStatCard(grid, '🙌 가장 많은 평가를 받은 급식', '아직 평가 없음');
            }

            const menuVotes = {};
            meals.forEach(meal => {
                const items = filterMenuItems(meal.menu);
                Object.entries(meal.votes).forEach(([index, count]) => {
                    const menuName = items[Number(index)];
                    if (menuName && Number(count) > 0) menuVotes[menuName] = (menuVotes[menuName] || 0) + Number(count);
                });
            });
            const voteEntries = Object.entries(menuVotes);
            if (voteEntries.length) {
                const maxVotes = Math.max(...voteEntries.map(([, count]) => count));
                const winners = voteEntries.filter(([, count]) => count === maxVotes).map(([name]) => name);
                addStatCard(grid, '🔥 가장 기대받은 메뉴', `${winners.length > 1 ? '공동 1위 · ' : ''}${winners.slice(0, 2).join(' · ')}${winners.length > 2 ? ` 외 ${winners.length - 2}개` : ''} · ${maxVotes}표`);
            } else {
                addStatCard(grid, '🔥 가장 기대받은 메뉴', '아직 투표 없음');
            }
            document.getElementById('feature-content').appendChild(grid);
        }

        async function copyText(text) {
            if (navigator.clipboard?.writeText) {
                await navigator.clipboard.writeText(text);
                return;
            }
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            const copied = document.execCommand('copy');
            textarea.remove();
            if (!copied) throw new Error('클립보드 복사에 실패했습니다.');
        }

        async function shareCurrentMeal() {
            if (!currentRenderedMenu || !dateInput.value || !['lunch', 'dinner'].includes(currentTab)) {
                showToast('공유할 급식 메뉴가 없습니다.', 'info');
                return;
            }
            const text = ['🍱 배정고 급식', `${formatMealDate(dateInput.value)} ${formatMealType(currentTab)}`, '', ...currentRenderedMenu.split(/,(?![^(]*\))/).map(item => item.trim()).filter(Boolean), '', '배정고 오늘의 급식', window.location.href].join('\n');
            if (navigator.share) {
                try {
                    await navigator.share({ title: '배정고 급식', text, url: window.location.href });
                    showToast('급식 메뉴를 공유했어요.');
                    return;
                } catch (error) {
                    if (error?.name === 'AbortError') return;
                    console.warn('Web Share API 공유 실패, 복사 방식으로 전환:', error);
                }
            }
            try {
                await copyText(text);
                showToast('급식 메뉴를 복사했어요.');
            } catch (error) {
                console.error('급식 메뉴 복사 실패:', error);
                showToast('급식 메뉴를 복사하지 못했어요.', 'error');
            }
        }

        function renderMealState(type) {
            const content = document.getElementById('menu-content');
            content.replaceChildren();
            currentRenderedMenu = '';

            const message = document.createElement('span');
            const detail = document.createElement('small');
            detail.className = 'meal-state-detail';

            if (type === 'loading') {
                message.textContent = "식단을 불러오는 중입니다 🍽️";
                const skeleton = document.createElement('div');
                skeleton.className = 'skeleton';
                skeleton.setAttribute('aria-hidden', 'true');
                for (let i = 0; i < 3; i += 1) {
                    const line = document.createElement('div');
                    line.className = 'skeleton-line';
                    skeleton.appendChild(line);
                }
                content.append(message, skeleton);
                return;
            }

            if (type === 'error' || type === 'api-error') {
                message.textContent = type === 'api-error' ? "급식 API 설정을 확인해 주세요 ⚙️" : "급식 정보를 불러오지 못했습니다 😢";
                detail.textContent = type === 'api-error'
                    ? "학교 정보 또는 나이스 API 응답에 문제가 있습니다. 관리자에게 알려주세요."
                    : "인터넷 연결 또는 나이스 API 상태를 확인한 뒤 다시 시도해 주세요.";
                const retryButton = document.createElement('button');
                retryButton.type = 'button';
                retryButton.className = 'retry-btn';
                retryButton.textContent = "다시 시도";
                retryButton.addEventListener('click', updateUI);
                content.append(message, detail, retryButton);
                return;
            }

            message.textContent = "등록된 급식이 없습니다 😴";
            detail.textContent = "주말·방학 또는 급식을 운영하지 않는 날일 수 있습니다.";
            content.append(message, detail);
        }

        function renderMenu(menu) {
            const content = document.getElementById('menu-content');
            content.replaceChildren();
            currentRenderedMenu = menu;

            menu.split(/,(?![^(]*\))/).forEach(item => {
                const row = document.createElement('div');
                const trimmedItem = item.trim();
                const detailMatch = trimmedItem.match(/^(.+?[^\s(])\s*(\(.*)$/);

                if (detailMatch) {
                    row.appendChild(document.createTextNode(detailMatch[1]));
                    const detail = document.createElement('span');
                    detail.className = 'menu-detail';
                    detail.textContent = detailMatch[2];
                    row.appendChild(detail);

                    row.textContent = trimmedItem;
                }

                content.appendChild(row);
            });

        function changeDate(offset) {
            if(!dateInput) return;
            const current = parseSafeDate(dateInput.value);
            current.setDate(current.getDate() + offset);
            const y = current.getFullYear();
            const m = String(current.getMonth() + 1).padStart(2, '0');

            dateInput.value = `${y}-${m}-${d}`;

        async function updateUI() {
            if(!dateInput) return;
            const date = dateInput.value;
            const requestedTab = currentTab;
            const card = document.getElementById('meal-card');
            const statusLabel = document.getElementById('meal-status');
            const suggestView = document.getElementById('suggestion-view-container');
            const mealView = document.getElementById('meal-view-container');
            updateSelectedDateLabel(date);
            
            if (currentTab === 'suggest') {
                if (activeMealController) activeMealController.abort();
                removeMealListeners();
                mealView.style.display = 'none'; suggestView.style.display = 'block'; loadSuggestions();
                document.getElementById('yesterday-winner-box').style.display = 'none';
            } else {
                removeFirebaseListener('suggestions');
                removeFirebaseListener('suggestionAuthors');
                removeMealListeners();
                mealView.style.display = 'block'; suggestView.style.display = 'none';
                card.className = `meal-content-area ${currentTab}`;
                const mealName = currentTab === 'lunch' ? '점심' : '저녁';
                statusLabel.innerText = mealName;
                renderMealState('loading');

                const fetchResult = await fetchNeisMeals(date);
                if (date !== dateInput.value || requestedTab !== currentTab) return;
                if (fetchResult.aborted) return;
                
                const menu = (currentTab === 'lunch') ? lunchData[date] : dinnerData[date];

                const parsedDate = parseSafeDate(date);
                const isThursdayDinner = (currentTab === 'dinner' && parsedDate.getDay() === 4);
                const isException = bapsimExceptions.includes(date);
                const isExamDay = menu && (menu.includes("고사") || menu.includes("시험") || menu.includes("평가"));

                if (menu && !isException && !isExamDay && (isThursdayDinner || specialDinnerDates.includes(date) || menu.includes("특식"))) {
                    card.classList.add('special-meal-card');
                    if (isThursdayDinner) {
                        statusLabel.innerText = "✨ 목 요 밥 심 데 이 ! 💪 ✨";
                    } else {
                        statusLabel.innerText = "✨ 오 늘 의 특 식 ! 🧡 ✨";
                    }
                } else { card.classList.remove('special-meal-card'); }

                if (!fetchResult.ok) renderMealState(fetchResult.type === 'api' ? 'api-error' : 'error');
                else if (menu) renderMenu(menu);
                else renderMealState('empty');
                
                try {
                    prepareRatingPanel();
                    loadRating(); loadComments(); loadPollData(); loadPreVoteResult();
                } catch(err) { console.error("서브 기능 로드 에러 방어:", err); }
            }
        }

        // 이하 파이어베이스 동기화 로직 보존 완료
        function loadPreVoteResult() {
            if(!dateInput) return;
            const winnerBox = document.getElementById('yesterday-winner-box');
            const targetDate = dateInput.value;
            const menu = (currentTab === 'lunch') ? lunchData[targetDate] : dinnerData[targetDate];
            
            if (!menu) { winnerBox.style.display = 'none'; return; }
            const menuItems = filterMenuItems(menu);

            database.ref(`polls/${targetDate}/${currentTab}`).once('value', (s) => {
                const votes = s.val();
                if (votes) {
                    let max = -1; let winIdx = -1;
                    Object.keys(votes).forEach(i => { if(votes[i] > max){ max = votes[i]; winIdx = i; } });
                    if (winIdx !== -1 && max > 0 && menuItems[winIdx]) {
                        winnerBox.style.display = 'block';
                        winnerBox.replaceChildren(document.createTextNode("👑 어제 우리가 뽑은 기대 메뉴 1위: "));
                        const winner = document.createElement('b');
                        winner.textContent = menuItems[winIdx];
                        winnerBox.append(winner, document.createTextNode(` (${max}표!)`));
                    } else { winnerBox.style.display = 'none'; }
                } else { winnerBox.style.display = 'none'; }
            });
        }

        function getRatingStorageKey(date, meal) {
            return `voted_${date}_${meal}`;
        }

        function setRatingInputsEnabled(enabled) {
            const stars = document.getElementById('rating-stars');
            stars.classList.toggle('disabled', !enabled);
            document.querySelectorAll('input[name="rating"]').forEach(input => {
                input.disabled = !enabled;
            });
        }

        function prepareRatingPanel() {
            ratingEditMode = false;
            currentRatingData = null;
            setRatingInputsEnabled(false);
            document.querySelectorAll('input[name="rating"]').forEach(input => { input.checked = false; });
            document.getElementById('rating-selection').textContent = '별점 기능을 준비하고 있습니다';
            document.getElementById('rating-view-actions').hidden = true;
            document.getElementById('rating-edit-actions').hidden = true;
        }

        function renderRatingState(data) {
            currentRatingData = data;
            const userRatings = Object.values(data?.users || {}).filter(rating => rating?.active);
            const totalScore = (Number(data?.totalScore) || 0)
                + userRatings.reduce((sum, rating) => sum + Number(rating.score || 0), 0);
            const voterCount = (Number(data?.voterCount) || 0) + userRatings.length;
            const averageElement = document.getElementById('average-rating-value');
            const countElement = document.getElementById('rating-count');
            const selectionElement = document.getElementById('rating-selection');
            const viewActions = document.getElementById('rating-view-actions');
            const editActions = document.getElementById('rating-edit-actions');
            const ownRating = currentUser ? data?.users?.[currentUser.uid] : null;
            const ownScore = ownRating?.active ? Number(ownRating.score) : null;

            if (voterCount > 0) {
                averageElement.textContent = `★ ${(totalScore / voterCount).toFixed(1)}`;
                countElement.textContent = `(${voterCount}명)`;
            } else {
                averageElement.textContent = '아직 평가 없음';
                countElement.textContent = '';
            }

            document.querySelectorAll('input[name="rating"]').forEach(input => {
                input.checked = Number(input.value) === ownScore;
            });

            if (ownScore) {
                setRatingInputsEnabled(ratingEditMode);
                selectionElement.textContent = ratingEditMode
                    ? `현재 ${ownScore}점 · 새 별점을 선택해 주세요`
                    : `내가 남긴 별점: ${ownScore}점`;
                viewActions.hidden = ratingEditMode;
                editActions.hidden = !ratingEditMode;
            } else {
                ratingEditMode = false;
                setRatingInputsEnabled(true);
                selectionElement.textContent = '별점을 선택해 주세요';
                viewActions.hidden = true;
                editActions.hidden = true;
            }
        }

        function buildSubmittedRating(existing, score, editing) {
            if (existing?.active && !editing) return;
            return { score, active: true };
        }

        function buildCanceledRating(existing) {
            if (!existing?.active) return;
            return { score: 0, active: false };
        }

        function startRatingEdit() {
            const ownRating = currentUser ? currentRatingData?.users?.[currentUser.uid] : null;
            if (!ownRating?.active) return;
            ratingEditMode = true;
            renderRatingState(currentRatingData);
        }

        function stopRatingEdit() {
            ratingEditMode = false;
            renderRatingState(currentRatingData);
        }

        async function submitRating(score) {
            if(!dateInput) return;
            const date = dateInput.value;
            const meal = currentTab;
            const editing = ratingEditMode;

            try {
                const user = await authReady;
                if (date !== dateInput.value || meal !== currentTab) return;
                const ownRatingRef = database.ref(`meals/${date}/${meal}/rating/users/${user.uid}`);
                const result = await ownRatingRef.transaction(
                    existing => buildSubmittedRating(existing, score, editing),
                    undefined,
                    false
                );

                if (!result.committed) {
                    showToast("이미 별점을 남기셨습니다. 수정 버튼을 이용해 주세요.", "info");
                    renderRatingState(result.snapshot.val());
                    return;
                }
                localStorage.setItem(getRatingStorageKey(date, meal), String(score));
                ratingEditMode = false;
                showToast(editing ? "별점을 수정했습니다! ✨" : "별점 감사합니다! ❤️");
            } catch (error) {
                console.error("별점 저장 실패:", error);
                renderRatingState(currentRatingData);
                showToast("별점을 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.", "error");
            }
        }

        async function cancelRating() {
            if (!dateInput || !currentUser) return;
            const date = dateInput.value;
            const meal = currentTab;
            const confirmed = await showConfirm("남긴 별점을 취소할까요?", "별점 취소", "별점 취소", "돌아가기");
            if (!confirmed || date !== dateInput.value || meal !== currentTab) return;

            try {
                const ownRatingRef = database.ref(`meals/${date}/${meal}/rating/users/${currentUser.uid}`);
                const result = await ownRatingRef.transaction(
                    existing => buildCanceledRating(existing),
                    undefined,
                    false
                );
                if (!result.committed) return showToast("취소할 별점이 없습니다.", "info");
                localStorage.removeItem(getRatingStorageKey(date, meal));
                ratingEditMode = false;
                showToast("별점을 취소했습니다.");
            } catch (error) {
                console.error("별점 취소 실패:", error);
                showToast("별점을 취소하지 못했습니다. 잠시 후 다시 시도해 주세요.", "error");
            }
        }

        async function loadRating() {
            if(!dateInput) return;
            const date = dateInput.value;
            const meal = currentTab;
            try {
                const user = await authReady;
                if (date !== dateInput.value || meal !== currentTab) return;
                const ratingRef = database.ref(`meals/${date}/${meal}/rating`);
                const handleRating = snapshot => renderRatingState(snapshot.val());
                replaceFirebaseListener('rating', ratingRef, handleRating);
            } catch (error) {
                console.error("별점 불러오기 실패:", error);
                document.getElementById('rating-selection').textContent = '별점 기능을 사용할 수 없습니다';
            }
        }

        function saveComment() {
            if(!dateInput) return;
            const date = dateInput.value; const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if (!text) return;
            database.ref(`meals/${date}/${currentTab}/comments`).push({ text, timestamp: new Date().toLocaleString(), likes: 0 })
                .then(() => {
                    input.value = "";
                    showToast("한줄평을 등록했습니다! 💬");
                })
                .catch((error) => {
                    console.error("한줄평 저장 실패:", error);
                    showToast("한줄평을 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.", "error");
                });
        }

        function likeComment(key) {
            if(!dateInput) return;
            if (localStorage.getItem(`liked_${key}`)) return showToast("이미 하트를 눌렀습니다! ❤️", "info");
            database.ref(`meals/${dateInput.value}/${currentTab}/comments/${key}/likes`).transaction(l => (l || 0) + 1)
                .then(() => {
                    localStorage.setItem(`liked_${key}`, true);
                    showToast("하트를 눌렀습니다! ❤️");
                })
                .catch((error) => {
                    console.error("좋아요 저장 실패:", error);
                    showToast("좋아요를 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.", "error");
                });
        }

        function loadComments() {
            if(!dateInput) return;
            const date = dateInput.value; const list = document.getElementById('comment-list');
            const commentsRef = database.ref(`meals/${date}/${currentTab}/comments`);
            const handleComments = (s) => {
                list.replaceChildren(); const data = s.val();
                if (data) Object.keys(data).reverse().forEach(k => {
                    const item = data[k]; const div = document.createElement('div');
                    div.className = 'comment-bubble';

                    const text = document.createElement('div');
                    text.className = 'comment-text';
                    text.textContent = item.text || "";

                    const meta = document.createElement('div');
                    meta.className = 'comment-meta';
                    const timestamp = document.createElement('span');
                    timestamp.textContent = item.timestamp || "";
                    const likeButton = document.createElement('button');
                    likeButton.className = 'like-badge';
                    likeButton.textContent = `❤️ ${item.likes || 0}`;
                    likeButton.addEventListener('click', () => likeComment(k));
                    meta.append(timestamp, likeButton);

                    div.append(text, meta);
                    list.appendChild(div);
                }); else showEmptyListMessage(list, "첫 한줄평을 남겨주세요! 😊");
            };
            replaceFirebaseListener('comments', commentsRef, handleComments);
        }

        async function loadPollData() {
            removeFirebaseListener('poll');
            const box = document.getElementById('poll-box');
            const requestSequence = ++pollLoadSequence;
            const now = new Date();
            try {
                const rows = await fetchPollMealRows(now);
                if (requestSequence !== pollLoadSequence || currentTab === 'suggest') return;
                const target = findNextPollMeal(getPollMealMap(rows), now);
                if (!target) { box.style.display = 'none'; return; }

                const items = filterMenuItems(target.menu);
                const list = document.getElementById('poll-items-list');
                if (items.length === 0) { box.style.display = 'none'; return; }
                document.getElementById('poll-title').textContent = `🔥 ${getPollTargetLabel(target, now)} 가장 기대되는 것은?`;
                box.style.display = 'block';
                const pollRef = database.ref(`polls/${target.date}/${target.mealType}`);
                const handlePoll = (s) => {
                    const votes = s.val() || {}; list.replaceChildren();
                    const selectedVoteValue = localStorage.getItem(`poll_${target.date}_${target.mealType}`);
                    const selectedVote = /^\d+$/.test(selectedVoteValue || '') ? Number(selectedVoteValue) : -1;
                    items.forEach((menuItem, i) => {
                        const div = document.createElement('button');
                        div.type = 'button';
                        div.className = `poll-item-row${selectedVote === i ? ' selected' : ''}`;
                        div.setAttribute('aria-pressed', String(selectedVote === i));
                        div.onclick = () => submitVote(target.date, target.mealType, i, menuItem);
                        const menuName = document.createElement('span');
                        menuName.textContent = menuItem;
                        const voteCount = document.createElement('b');
                        voteCount.style.color = 'var(--info)';
                        voteCount.textContent = `${votes[i] || 0}명`;
                        div.append(menuName, voteCount);
                        list.appendChild(div);
                    });
                };
                replaceFirebaseListener('poll', pollRef, handlePoll);
            } catch (error) {
                if (requestSequence !== pollLoadSequence) return;
                console.error('다음 급식 투표 대상 조회 실패:', error);
                box.style.display = 'none';
            }
        }

        async function submitVote(voteDate, mealType, idx, name) {
            if (localStorage.getItem(`poll_${voteDate}_${mealType}`)) return showToast("이 급식에는 이미 투표하셨습니다! 😊", "info");
            const confirmed = await showConfirm(`"${name}" 메뉴에 투표할까요?`, "투표 확인", "투표하기", "취소");
            if (!confirmed) return;
            database.ref(`polls/${voteDate}/${mealType}/${idx}`).transaction(v => (v || 0) + 1).then(() => {
                localStorage.setItem(`poll_${voteDate}_${mealType}`, String(idx));
                showToast("투표 완료! 🔥");
                loadPollData();
            }).catch((error) => {
                console.error("투표 저장 실패:", error);
                showToast("투표를 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.", "error");
            });
        }

        async function saveSuggestion() {
            const input = document.getElementById('suggest-input');
            const text = input.value.trim();
            if (!text) return showToast("건의 내용을 입력해 주세요.", "info");

            let author = auth.currentUser;
            if (!isGoogleSuggestionUser(author)) {
                showToast("건의 작성에는 Google 계정 로그인이 필요합니다.", "info");
                author = await signInForSuggestion();
                if (!author) return;
            }

            let tokenResult;
            try {
                tokenResult = await author.getIdTokenResult(true);
            } catch (error) {
                console.error("건의 작성 인증 토큰 확인 실패:", {
                    errorCode: error.code,
                    errorMessage: error.message,
                    uid: author?.uid,
                    displayName: author?.displayName,
                    providerData: author?.providerData
                }, error);
                showToast("Google 로그인 상태를 확인하지 못했습니다. 다시 로그인 후 시도해 주세요.", "error");
                return;
            }

            const activeAuthor = auth.currentUser;
            const signInProvider = tokenResult?.claims?.firebase?.sign_in_provider;
            console.info("건의 작성 Google 로그인 확인:", {
                uid: activeAuthor?.uid,
                displayName: activeAuthor?.displayName,
                providerData: activeAuthor?.providerData,
                signInProvider
            });
            if (!activeAuthor || activeAuthor.uid !== author.uid || signInProvider !== 'google.com') {
                console.error("건의 작성 인증 상태 불일치:", {
                    expectedUid: author?.uid,
                    currentUid: activeAuthor?.uid,
                    signInProvider,
                    providerData: activeAuthor?.providerData
                });
                showToast("Google 로그인 상태를 다시 확인한 뒤 건의를 등록해 주세요.", "error");
                return;
            }

            const authorName = author.displayName?.trim() || "이름 정보 없음";

            const suggestionId = database.ref('suggestions').push().key;
            const createdAt = new Date().toISOString();
            const suggestionPath = `suggestions/${suggestionId}`;
            const authorPath = `suggestionAuthors/${suggestionId}`;
            const updates = {};
            updates[suggestionPath] = { content: text, createdAt };
            updates[authorPath] = { authorUid: author.uid, authorName };

            try {
                await database.ref().update(updates);
                input.value = "";
                showToast("건의사항을 등록했습니다! 💡");
            } catch (error) {
                console.error("건의사항 저장 실패:", {
                    errorCode: error.code,
                    errorMessage: error.message,
                    suggestionId,
                    writeOperation: "atomic multi-location update",
                    affectedPaths: [suggestionPath, authorPath],
                    uid: activeAuthor.uid,
                    signInProvider
                }, error);
                showToast("건의사항을 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.", "error");
            }
        }

        function loadSuggestions() {
            const list = document.getElementById('suggest-list');
            const suggestionsRef = database.ref(`suggestions`);
            const renderSuggestions = () => {
                list.replaceChildren();
                if (currentSuggestions) Object.keys(currentSuggestions).reverse().forEach(key => {
                    const item = currentSuggestions[key]; const div = document.createElement('div');
                    div.className = 'comment-bubble'; div.style.borderColor = "#D1E9FF";

                    const text = document.createElement('div');
                    text.className = 'comment-text';
                    text.style.color = 'var(--info)';
                    text.textContent = `💡 ${item.content || item.text || ""}`;

                    const timestamp = document.createElement('span');
                    timestamp.className = 'comment-meta';
                    timestamp.textContent = item.createdAt
                        ? new Date(item.createdAt).toLocaleString()
                        : item.timestamp || "";

                    const metaRow = document.createElement('div');
                    metaRow.className = 'comment-meta';
                    metaRow.append(timestamp);

                    if (isAdmin) {
                        const author = document.createElement('span');
                        const authorInfo = currentSuggestionAuthors?.[key];
                        const authorName = authorInfo?.authorName || '기존 익명 작성';
                        author.textContent = `작성자: ${authorName}`;
                        metaRow.append(author);

                        const deleteButton = document.createElement('button');
                        deleteButton.type = 'button';
                        deleteButton.className = 'suggestion-delete-btn';
                        deleteButton.textContent = '삭제';
                        deleteButton.setAttribute('aria-label', '건의사항 삭제');
                        deleteButton.addEventListener('click', () => deleteSuggestion(key));
                        metaRow.append(deleteButton);
                    }

                    div.append(text, metaRow);
                    list.appendChild(div);
                }); else showEmptyListMessage(list, "건의사항을 남겨주세요! 😊");
            };
            const handleSuggestions = (s) => {
                currentSuggestions = s.val();
                renderSuggestions();
            };
            replaceFirebaseListener('suggestions', suggestionsRef, handleSuggestions);

            if (isAdmin) {
                const authorsRef = database.ref('suggestionAuthors');
                const handleAuthors = snapshot => {
                    currentSuggestionAuthors = snapshot.val();
                    renderSuggestions();
                };
                replaceFirebaseListener('suggestionAuthors', authorsRef, handleAuthors);
            } else {
                currentSuggestionAuthors = null;
                removeFirebaseListener('suggestionAuthors');
            }
        }

        async function deleteSuggestion(key) {
            if (!isAdmin) return;
            const confirmed = await showConfirm("이 건의글을 삭제할까요? 삭제한 내용은 다시 확인할 수 없습니다.", "건의사항 삭제", "삭제", "취소");
            if (!confirmed) return;
            const suggestionPath = `suggestions/${key}`;
            const authorPath = `suggestionAuthors/${key}`;
            try {
                await database.ref().update({
                    [suggestionPath]: null,
                    [authorPath]: null
                });
                showToast("건의사항을 삭제했습니다.");
            } catch (error) {
                console.error("건의사항 삭제 실패:", {
                    errorCode: error.code,
                    errorMessage: error.message,
                    suggestionId: key,
                    paths: [suggestionPath, authorPath]
                }, error);
                showToast("건의사항을 삭제하지 못했습니다.", "error");
            }
        }

        function changeTab(tab) {
            currentTab = tab; document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.querySelectorAll('.tab-item').forEach(el => el.setAttribute('aria-selected', String(el.id === `tab-${tab}`)));
            updateUI();
        }

        window.addEventListener('beforeunload', () => {
            if (activeMealController) activeMealController.abort();
            Object.keys(activeListeners).forEach(removeFirebaseListener);
        });

        setToday();
        setInitialMealTab();
        updateUI();
    </script>
</body>
</html>
