<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 배정고 오늘의 급식!</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍱</text></svg>">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root {
            --primary: #4CAF50; --primary-light: #E8F5E9;
            --secondary: #FF9800; --secondary-light: #FFF3E0;
            --info: #2196F3; --bg: #F5F7FA; --card: #FFFFFF; --like: #FF5252;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg); margin: 0; padding: 15px 0; display: flex; justify-content: center; min-height: 100vh; color: #333; }
        button, input { font: inherit; }
        button:focus-visible, input:focus-visible { outline: 3px solid rgba(33,150,243,0.35); outline-offset: 2px; }
        .app-container { width: min(100%, 460px); padding: 0 max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left)); }
        .main-card { background: var(--card); border-radius: 35px; padding: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.06); text-align: center; }
        
        .header h1 { font-size: 1.6rem; color: #333; margin: 0; font-weight: 800; letter-spacing: -1px; }
        .header p { font-size: 0.9rem; color: #666; margin: 5px 0 25px; font-weight: 700; opacity: 0.8; }

        .date-box { margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .date-label { font-size: 0.8rem; color: #888; font-weight: 600; }
        .selected-date-label { font-size: 1rem; color: #444; font-weight: 800; }
        .date-context-badge { display: inline-flex; align-items: center; min-height: 24px; padding: 3px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; background: #EEF2F7; color: #667085; }
        .date-context-badge.today { background: #E8F5E9; color: #2E7D32; }
        .date-context-badge.past { background: #F2F4F7; color: #667085; }
        .date-context-badge.future { background: #E3F2FD; color: #1565C0; }
        .date-controls { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .date-nav-btn {
            background: #fff; border: 2px solid #EEE; border-radius: 50%;
            width: 44px; height: 44px; cursor: pointer; font-size: 0.8rem;
            color: #999; display: flex; align-items: center; justify-content: center;
            transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); flex-shrink: 0;
        }
        .date-nav-btn:hover { background: #f0f0f0; color: var(--secondary); border-color: var(--secondary); }
        .today-btn { min-height: 38px; border: 0; border-radius: 999px; padding: 7px 13px; background: #333; color: #FFF; cursor: pointer; font-size: 0.78rem; font-weight: 800; }
        input[type="date"] {
            border: 2px solid #EEE; border-radius: 50px; padding: 10px 12px; min-height: 44px;
            font-size: 0.95rem; font-weight: 700; color: #555; outline: none;
            background: #FDFDFD; cursor: pointer; width: min(64%, 210px); text-align: center;
        }

        .tab-switch { display: flex; background: #EEE; border-radius: 20px; padding: 5px; margin-bottom: 20px; gap: 3px; }
        .tab-item { flex: 1; min-height: 44px; padding: 10px 5px; border: 0; background: transparent; cursor: pointer; border-radius: 16px; font-weight: 700; color: #777; transition: 0.3s; font-size: 0.85rem; }
        .tab-item.active.lunch { background: var(--primary); color: white; }
        .tab-item.active.dinner { background: var(--secondary); color: white; }
        .tab-item.active.suggest { background: var(--info); color: white; }

        #yesterday-winner-box {
            background: linear-gradient(to right, #FFF9E1, #FFF2CC);
            border: 1px solid #FFE599; border-radius: 15px;
            padding: 10px; margin-bottom: 15px; font-size: 0.85rem; font-weight: 700;
            color: #856404; display: none;
        }

        .meal-content-area {
            background: #FAFAFA; border-radius: 25px; padding: 25px 20px; min-height: 150px;
            border: 1px solid #F0F0F0; transition: 0.3s; position: relative; margin-bottom: 20px;
        }
        .meal-content-area.lunch { background: var(--primary-light); border-color: #C8E6C9; }
        .meal-content-area.dinner { background: var(--secondary-light); border-color: #FFE0B2; }
        
        .meal-label-row { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 15px; }
        .meal-status-label { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; }
        .lunch .meal-status-label { background: var(--primary); color: white; }
        .dinner .meal-status-label { background: var(--secondary); color: white; }
        .average-rating { font-size: 0.85rem; color: #777; font-weight: 600; }

        @keyframes special-glow {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(255,152,0,0.3); }
            50% { transform: scale(1.03); box-shadow: 0 0 25px rgba(255,152,0,0.6); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(255,152,0,0.3); }

        .special-meal-card { animation: special-glow 2s infinite ease-in-out; border: 4px solid #FF9800 !important; background: #FFFDF0 !important; }
        .special-meal-card .meal-status-label { 
            font-size: 1.2rem !important; padding: 8px 18px !important; 
            background: linear-gradient(45deg, #FF5252, #FF9800) !important;

        .menu-text { line-height: 2.0; color: #444; font-size: 1.15rem; font-weight: 700; word-break: keep-all; overflow-wrap: break-word; letter-spacing: -0.2px; }
        .menu-detail { display: block; color: #888; font-size: 0.85rem; font-weight: 500; }
        .meal-state-detail { display: block; color: #888; font-size: 0.78rem; font-weight: 500; line-height: 1.5; margin-top: 6px; }

        }
        .skeleton { display: grid; gap: 10px; padding: 8px 5px; }
        .skeleton-line { height: 18px; border-radius: 10px; background: linear-gradient(90deg, #E9ECEF 25%, #F8F9FA 50%, #E9ECEF 75%); background-size: 200% 100%; animation: skeleton-wave 1.4s infinite; }
        .skeleton-line:nth-child(2) { width: 82%; margin-inline: auto; }
        .skeleton-line:nth-child(3) { width: 68%; margin-inline: auto; }

        .poll-item-row.selected { background: #E3F2FD; border-color: #64B5F6; box-shadow: inset 0 0 0 1px #64B5F6; }

        .comments-section { text-align: left; margin-top: 30px; }
        .comment-input-row { display: flex; gap: 8px; margin-bottom: 18px; }
        .comment-input-row input { min-width: 0; min-height: 44px; flex: 1; padding: 12px 18px; border-radius: 15px; border: 2px solid #EEE; outline: none; font-size: 0.9rem; }
        .comment-input-row button { min-width: 64px; min-height: 44px; background: #333; color: white; border: none; padding: 0 18px; border-radius: 15px; cursor: pointer; font-weight: 700; }

        .comment-bubble { background: #FFF; padding: 15px; border-radius: 20px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); border: 1px solid #F0F0F0; position: relative; }
        .comment-text { font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; color: #444; }
        .comment-meta { font-size: 0.7rem; color: #AAA; display: flex; align-items: center; gap: 10px; }
        .like-badge { min-height: 36px; cursor: pointer; border: none; background: rgba(255,82,82,0.1); color: var(--like); padding: 6px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; }
        .scroll-area { max-height: 300px; overflow-y: auto; padding-right: 5px; }
        .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 1000; width: min(calc(100% - 32px), 390px); padding: 13px 16px; border-radius: 14px; background: #333; color: #FFF; box-shadow: 0 10px 30px rgba(0,0,0,0.2); font-size: 0.9rem; font-weight: 700; text-align: center; opacity: 0; transform: translate(-50%, 16px); pointer-events: none; transition: 0.25s; }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }
        .toast.error { background: #C62828; }
        .toast.info { background: #1565C0; }
        .modal-backdrop { position: fixed; inset: 0; z-index: 1100; display: grid; place-items: center; padding: 20px; background: rgba(15,23,42,0.48); }
        .modal-backdrop[hidden] { display: none; }
        .confirm-dialog { width: min(100%, 360px); padding: 24px; border-radius: 22px; background: #FFF; box-shadow: 0 20px 60px rgba(0,0,0,0.22); text-align: center; }
        .confirm-dialog h2 { margin: 0 0 8px; font-size: 1.15rem; }
        .confirm-dialog p { margin: 0 0 20px; color: #555; line-height: 1.5; overflow-wrap: anywhere; }
        .modal-actions { display: flex; gap: 8px; }
        .modal-actions button { flex: 1; min-height: 44px; border: 0; border-radius: 12px; cursor: pointer; font-weight: 800; }
        .modal-cancel { background: #EEF0F3; color: #555; }
        .modal-confirm { background: var(--info); color: #FFF; }
        footer { margin-top: 25px; font-size: 0.75rem; color: #BBB; text-align: center; padding-bottom: 15px; }

        @media (max-width: 600px) {
            body { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: env(safe-area-inset-bottom); }
            .app-container { padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right)); }
            .main-card { border-radius: 26px; padding: 20px 16px; }
            .navigation-panel { position: sticky; top: max(0px, env(safe-area-inset-top)); z-index: 20; margin: 0 -8px 16px; padding: 8px; border-radius: 20px; background: rgba(255,255,255,0.96); box-shadow: 0 8px 20px rgba(15,23,42,0.07); backdrop-filter: blur(10px); }
            .date-box, .tab-switch { margin-bottom: 10px; }
            .tab-switch { margin-bottom: 0; }
            .menu-text { font-size: clamp(0.98rem, 4.3vw, 1.12rem); line-height: 1.85; word-break: normal; overflow-wrap: anywhere; }
            .comment-text, .poll-item-row span { overflow-wrap: anywhere; word-break: normal; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBuUIzRhnj2lohiMZiXWmIosJDluEqp0-o",
            authDomain: "baejeong-lunch.firebaseapp.com",
            databaseURL: "https://baejeong-lunch-default-rtdb.firebaseio.com", 
            projectId: "baejeong-lunch",
            storageBucket: "baejeong-lunch.firebasestorage.app",
            messagingSenderId: "297041913628",
            appId: "1:297041913628:web:dca35b9917a5c2888ffcd9"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const NEIS_API_KEY = "bf6e5aee52104b2e915676c9c6ac6fad";
        const OFFICE_CODE = "C10";
        const SCHOOL_CODE = "7150136";
        const MEAL_CACHE_PREFIX = "baejeong-meals-v1:";
        const MEAL_CACHE_TTL = 15 * 60 * 1000;

        const dateInput = document.getElementById('date-selector');
        let currentTab = 'lunch';

        let lunchData = {};
        let dinnerData = {};
        
        const bapsimExceptions = []; 
        const specialDinnerDates = [];

        const activeListeners = {};
        let activeMealController = null;
        let toastTimer = null;

        function replaceFirebaseListener(name, ref, callback) {
            removeFirebaseListener(name);
            ref.on('value', callback);
            activeListeners[name] = { ref, callback };
        }

        function removeFirebaseListener(name) {
            const listener = activeListeners[name];
            if (!listener) return;
            listener.ref.off('value', listener.callback);
            delete activeListeners[name];
        }

        function removeMealListeners() {
            removeFirebaseListener('rating');
            removeFirebaseListener('comments');
            removeFirebaseListener('poll');
        }

        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            clearTimeout(toastTimer);
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            toastTimer = setTimeout(() => { toast.className = 'toast'; }, 2800);
        }

        function showConfirm(message) {
            const modal = document.getElementById('confirm-modal');
            const messageElement = document.getElementById('confirm-message');
            const confirmButton = document.getElementById('confirm-ok');
            const cancelButton = document.getElementById('confirm-cancel');
            messageElement.textContent = message;
            modal.hidden = false;
            confirmButton.focus();

            return new Promise(resolve => {
                const close = result => {
                    modal.hidden = true;
                    confirmButton.removeEventListener('click', onConfirm);
                    cancelButton.removeEventListener('click', onCancel);
                    modal.removeEventListener('click', onBackdrop);
                    document.removeEventListener('keydown', onKeydown);
                    resolve(result);
                };
                const onConfirm = () => close(true);
                const onCancel = () => close(false);
                const onBackdrop = event => { if (event.target === modal) close(false); };
                const onKeydown = event => { if (event.key === 'Escape') close(false); };
                confirmButton.addEventListener('click', onConfirm);
                cancelButton.addEventListener('click', onCancel);
                modal.addEventListener('click', onBackdrop);
                document.addEventListener('keydown', onKeydown);
            });
        }

        function parseSafeDate(dateStr) {
            if (!dateStr) return new Date();
            const parts = dateStr.split('-');
            return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        function getCachedMeals(cacheKey) {
            try {
                const cached = JSON.parse(sessionStorage.getItem(`${MEAL_CACHE_PREFIX}${cacheKey}`));
                if (!cached || cached.expiresAt < Date.now()) return null;
                return cached.rows;
            } catch {
                return null;
            }
        }

        function cacheMeals(cacheKey, rows) {
            try {
                sessionStorage.setItem(`${MEAL_CACHE_PREFIX}${cacheKey}`, JSON.stringify({
                    expiresAt: Date.now() + MEAL_CACHE_TTL,
                    rows
                }));
            } catch (error) {
                console.warn("급식 캐시 저장 실패:", error);
            }
        }

        async function fetchJsonWithRetry(url, externalSignal, retries = 1, timeoutMs = 8000) {
            let lastError;
            for (let attempt = 0; attempt <= retries; attempt += 1) {
                if (externalSignal.aborted) throw new DOMException("요청이 취소되었습니다.", "AbortError");
                const attemptController = new AbortController();
                const abortAttempt = () => attemptController.abort();
                externalSignal.addEventListener('abort', abortAttempt, { once: true });
                let timedOut = false;
                const timeoutId = setTimeout(() => {
                    timedOut = true;
                    attemptController.abort();
                }, timeoutMs);
                try {
                    const response = await fetch(url, { signal: attemptController.signal });
                    if (!response.ok) {
                        const httpError = new Error(`급식 정보 요청 실패 (${response.status})`);
                        httpError.retryable = response.status === 429 || response.status >= 500;
                        throw httpError;
                    }
                    return await response.json();
                } catch (error) {
                    if (externalSignal.aborted) throw new DOMException("요청이 취소되었습니다.", "AbortError");
                    lastError = timedOut ? new Error("급식 정보 요청 시간이 초과되었습니다.") : error;
                    const retryable = timedOut || error instanceof TypeError || error.retryable;
                    if (attempt === retries || !retryable) throw lastError;
                } finally {
                    clearTimeout(timeoutId);
                    externalSignal.removeEventListener('abort', abortAttempt);
                }
            }
            throw lastError;
        }

        function applyMealRows(rows, days) {
            days.forEach(day => {
                const ymd = `${day.getFullYear()}${String(day.getMonth() + 1).padStart(2, '0')}${String(day.getDate()).padStart(2, '0')}`;
                const dateKey = `${ymd.substring(0,4)}-${ymd.substring(4,6)}-${ymd.substring(6,8)}`;
                delete lunchData[dateKey];
                delete dinnerData[dateKey];
            });

            rows.forEach(row => {
                const ymd = row.MLSV_YMD;
                const hyphenDate = `${ymd.substring(0,4)}-${ymd.substring(4,6)}-${ymd.substring(6,8)}`;
                const menuClean = row.DDISH_NM
                    .replace(/<br\s*\/?>/gi, ',')
                    .replace(/\([\d\.]+\)/g, '')
                    .replace(/\s+/g, ' ')
                    .trim();

                if (row.MMEAL_SC_CODE === "2") lunchData[hyphenDate] = menuClean;
                if (row.MMEAL_SC_CODE === "3") dinnerData[hyphenDate] = menuClean;
            });
        }

        async function fetchNeisMeals(centerDateStr) {
            if (activeMealController) activeMealController.abort();
            const requestController = new AbortController();
            activeMealController = requestController;

            const centerDate = parseSafeDate(centerDateStr);
            const yesterday = new Date(centerDate); yesterday.setDate(yesterday.getDate() - 1);
            const tomorrow = new Date(centerDate); tomorrow.setDate(tomorrow.getDate() + 1);

            const formatDate = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
            const fromYmd = formatDate(yesterday);
            const toYmd = formatDate(tomorrow);
            const cacheKey = `${fromYmd}-${toYmd}`;
            const cachedRows = getCachedMeals(cacheKey);

            if (cachedRows) {
                applyMealRows(cachedRows, [yesterday, centerDate, tomorrow]);
                if (activeMealController === requestController) activeMealController = null;
                return { ok: true, source: 'cache' };
            }

            const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&KEY=${NEIS_API_KEY}&ATPT_OFCDC_SC_CODE=${OFFICE_CODE}&SD_SCHUL_CODE=${SCHOOL_CODE}&MLSV_FROM_YMD=${fromYmd}&MLSV_TO_YMD=${toYmd}`;

            try {
                const data = await fetchJsonWithRetry(url, requestController.signal);
                const apiResult = data.RESULT || data.mealServiceDietInfo?.[0]?.head?.find(item => item.RESULT)?.RESULT;
                if (apiResult && !["INFO-000", "INFO-200"].includes(apiResult.CODE)) {
                    return { ok: false, type: 'api', error: new Error(apiResult.MESSAGE || "나이스 API 오류") };
                }

                const rows = data.mealServiceDietInfo?.[1]?.row || [];
                applyMealRows(rows, [yesterday, centerDate, tomorrow]);
                cacheMeals(cacheKey, rows);
                return { ok: true, source: 'network' };
            } catch (e) {
                if (e.name === 'AbortError') return { ok: false, aborted: true, error: e };
                console.error("나이스 API 통신 오류:", e);
                return { ok: false, type: 'network', error: e };
            } finally {
                if (activeMealController === requestController) activeMealController = null;
            }
        }

        function filterMenuItems(menuStr) {
            if(!menuStr) return [];
            return menuStr.split(/,(?![^(]*\))/).map(s=>s.trim()).filter(item => {
                if (item === "") return false;
                const baseName = item.replace(/\([^)]*\)/g, '').trim();
                if (baseName.endsWith('밥')) return false;
                if (baseName.endsWith('김치') || baseName === '김치') return false;
                const skipSides = ["깍두기", "석박지", "단무지", "맛김", "김자반", "쌈장", "마늘", "소스"];
                if (skipSides.includes(baseName)) return false;
                return true;
            });
        }

        function getTodayString() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        function updateSelectedDateLabel(dateStr) {
            const selectedDateLabel = document.getElementById('selected-date-label');
            const contextBadge = document.getElementById('date-context-badge');
            const todayButton = document.getElementById('today-button');
            const selectedDate = parseSafeDate(dateStr);
            const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
            selectedDateLabel.textContent = `${selectedDate.getFullYear()}년 ${selectedDate.getMonth() + 1}월 ${selectedDate.getDate()}일 ${weekdays[selectedDate.getDay()]}요일`;
            const today = getTodayString();
            const context = dateStr === today ? 'today' : (dateStr < today ? 'past' : 'future');
            contextBadge.className = `date-context-badge ${context}`;
            contextBadge.textContent = context === 'today' ? '오늘' : (context === 'past' ? '지난 급식' : '예정 급식');
            todayButton.hidden = context === 'today';
        }

        function renderMealState(type) {
            const content = document.getElementById('menu-content');
            content.replaceChildren();

            const message = document.createElement('span');
            const detail = document.createElement('small');
            detail.className = 'meal-state-detail';

            if (type === 'loading') {
                message.textContent = "식단을 불러오는 중입니다 🍽️";
                const skeleton = document.createElement('div');
                skeleton.className = 'skeleton';
                skeleton.setAttribute('aria-hidden', 'true');
                for (let i = 0; i < 3; i += 1) {
                    const line = document.createElement('div');
                    line.className = 'skeleton-line';
                    skeleton.appendChild(line);
                }
                content.append(message, skeleton);
                return;
            }

            if (type === 'error' || type === 'api-error') {
                message.textContent = type === 'api-error' ? "급식 API 설정을 확인해 주세요 ⚙️" : "급식 정보를 불러오지 못했습니다 😢";
                detail.textContent = type === 'api-error'
                    ? "학교 정보 또는 나이스 API 응답에 문제가 있습니다. 관리자에게 알려주세요."
                    : "인터넷 연결 또는 나이스 API 상태를 확인한 뒤 다시 시도해 주세요.";
                const retryButton = document.createElement('button');
                retryButton.type = 'button';
                retryButton.className = 'retry-btn';
                retryButton.textContent = "다시 시도";
                retryButton.addEventListener('click', updateUI);
                content.append(message, detail, retryButton);
                return;
            }

            message.textContent = "등록된 급식이 없습니다 😴";
            detail.textContent = "주말·방학 또는 급식을 운영하지 않는 날일 수 있습니다.";
            content.append(message, detail);
        }

        function renderMenu(menu) {
            const content = document.getElementById('menu-content');
            content.replaceChildren();

            menu.split(/,(?![^(]*\))/).forEach(item => {
                const row = document.createElement('div');
                const trimmedItem = item.trim();
                const detailMatch = trimmedItem.match(/^(.+?[^\s(])\s*(\(.*)$/);

                if (detailMatch) {
                    row.appendChild(document.createTextNode(detailMatch[1]));
                    const detail = document.createElement('span');
                    detail.className = 'menu-detail';
                    detail.textContent = detailMatch[2];
                    row.appendChild(detail);
                } else {
                    row.textContent = trimmedItem;
                }

                content.appendChild(row);
            });
        }

        function showEmptyListMessage(list, text) {
            const message = document.createElement('p');
            message.style.textAlign = 'center';
            message.style.color = '#BBB';
            message.style.fontSize = '0.8rem';
            message.textContent = text;
            list.replaceChildren(message);
        }

        function setToday() {
            if(dateInput) dateInput.value = getTodayString();
        }

        function goToday() {
            setToday();
            updateUI();
        }

        function getDefaultMealTab(now = new Date()) {
            return now.getHours() >= 13 ? 'dinner' : 'lunch';
        }

        function setInitialMealTab() {
            currentTab = getDefaultMealTab();
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${currentTab}`).classList.add('active');
            document.querySelectorAll('.tab-item').forEach(el => el.setAttribute('aria-selected', String(el.id === `tab-${currentTab}`)));
        }

        function changeDate(offset) {
            if(!dateInput) return;
            const current = parseSafeDate(dateInput.value);
            current.setDate(current.getDate() + offset);
            const y = current.getFullYear();
            const m = String(current.getMonth() + 1).padStart(2, '0');
            const d = String(current.getDate()).padStart(2, '0');
            dateInput.value = `${y}-${m}-${d}`;
            updateUI();
        }

        async function updateUI() {
            if(!dateInput) return;
            const date = dateInput.value;
            const requestedTab = currentTab;
            const card = document.getElementById('meal-card');
            const statusLabel = document.getElementById('meal-status');
            const suggestView = document.getElementById('suggestion-view-container');
            const mealView = document.getElementById('meal-view-container');
            updateSelectedDateLabel(date);
            
            if (currentTab === 'suggest') {
                if (activeMealController) activeMealController.abort();
                removeMealListeners();
                mealView.style.display = 'none'; suggestView.style.display = 'block'; loadSuggestions();
                document.getElementById('yesterday-winner-box').style.display = 'none';
            } else {
                removeFirebaseListener('suggestions');
                removeMealListeners();
                mealView.style.display = 'block'; suggestView.style.display = 'none';
                card.className = `meal-content-area ${currentTab}`;
                const today = getTodayString();
                const mealName = currentTab === 'lunch' ? '점심' : '저녁';
                const selectedDate = parseSafeDate(date);
                statusLabel.innerText = date === today
                    ? `오늘의 ${mealName}`
                    : `${selectedDate.getMonth() + 1}월 ${selectedDate.getDate()}일 ${mealName}`;
                renderMealState('loading');

                const fetchResult = await fetchNeisMeals(date);
                if (date !== dateInput.value || requestedTab !== currentTab) return;
                if (fetchResult.aborted) return;
                
                const menu = (currentTab === 'lunch') ? lunchData[date] : dinnerData[date];

                const parsedDate = parseSafeDate(date);
                const isThursdayDinner = (currentTab === 'dinner' && parsedDate.getDay() === 4);
                const isException = bapsimExceptions.includes(date);
                const isExamDay = menu && (menu.includes("고사") || menu.includes("시험") || menu.includes("평가"));

                if (menu && !isException && !isExamDay && (isThursdayDinner || specialDinnerDates.includes(date) || menu.includes("특식"))) {
                    card.classList.add('special-meal-card');
                    if (isThursdayDinner) {
                        statusLabel.innerText = "✨ 목 요 밥 심 데 이 ! 💪 ✨";
                    } else {
                        statusLabel.innerText = "✨ 오 늘 의 특 식 ! 🧡 ✨";
                    }
                } else { card.classList.remove('special-meal-card'); }

                if (!fetchResult.ok) renderMealState(fetchResult.type === 'api' ? 'api-error' : 'error');
                else if (menu) renderMenu(menu);
                else renderMealState('empty');
                
                try {
                    updateRatingSelection();
                    loadRating(); loadComments(); loadPollData(); loadPreVoteResult();
                } catch(err) { console.error("서브 기능 로드 에러 방어:", err); }
            }
        }

        // 이하 파이어베이스 동기화 로직 보존 완료
        function loadPreVoteResult() {
            if(!dateInput) return;
            const winnerBox = document.getElementById('yesterday-winner-box');
            const targetDate = dateInput.value;
            const menu = (currentTab === 'lunch') ? lunchData[targetDate] : dinnerData[targetDate];
            
            if (!menu) { winnerBox.style.display = 'none'; return; }
            const menuItems = filterMenuItems(menu);

            database.ref(`polls/${targetDate}/${currentTab}`).once('value', (s) => {
                const votes = s.val();
                if (votes) {
                    let max = -1; let winIdx = -1;
                    Object.keys(votes).forEach(i => { if(votes[i] > max){ max = votes[i]; winIdx = i; } });
                    if (winIdx !== -1 && max > 0 && menuItems[winIdx]) {
                        winnerBox.style.display = 'block';
                        winnerBox.replaceChildren(document.createTextNode("👑 어제 우리가 뽑은 기대 메뉴 1위: "));
                        const winner = document.createElement('b');
                        winner.textContent = menuItems[winIdx];
                        winnerBox.append(winner, document.createTextNode(` (${max}표!)`));
                    } else { winnerBox.style.display = 'none'; }
                } else { winnerBox.style.display = 'none'; }
            });
        }

        function updateRatingSelection(score = null) {
            const date = dateInput?.value;
            const stored = score ?? Number(localStorage.getItem(`voted_${date}_${currentTab}`));
            document.querySelectorAll('input[name="rating"]').forEach(input => {
                input.checked = Number(input.value) === stored;
            });
            document.getElementById('rating-selection').textContent = stored >= 1 && stored <= 5
                ? `내가 선택한 별점: ${stored}점`
                : '';
        }

        function submitRating(score) {
            if(!dateInput) return;
            const date = dateInput.value;
            if (localStorage.getItem(`voted_${date}_${currentTab}`)) {
                updateRatingSelection();
                return showToast("이미 별점을 남기셨습니다! 😊", "info");
            }
            database.ref(`meals/${date}/${currentTab}/rating`).transaction((data) => {
                if (!data) return { totalScore: score, voterCount: 1 };
                const newTotal = (data.totalScore || 0) + score;
                const newCount = (data.voterCount || 0) + 1;
                return { totalScore: newTotal, voterCount: newCount };
            }).then(() => {
                localStorage.setItem(`voted_${date}_${currentTab}`, String(score));
                updateRatingSelection(score);
                showToast("별점 감사합니다! ❤️");
            }).catch((error) => {
                console.error("별점 저장 실패:", error);
                updateRatingSelection();
                showToast("별점을 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.", "error");
            });
        }

        function loadRating() {
            if(!dateInput) return;
            const ratingRef = database.ref(`meals/${dateInput.value}/${currentTab}/rating`);
            const handleRating = (s) => {
                const d = s.val();
                const average = d?.voterCount ? (d.totalScore / d.voterCount).toFixed(1) : '0.0';
                document.getElementById('avg-rating-display').textContent = `★ ${average}`;
            };
            replaceFirebaseListener('rating', ratingRef, handleRating);
        }

        function saveComment() {
            if(!dateInput) return;
            const date = dateInput.value; const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if (!text) return;
            database.ref(`meals/${date}/${currentTab}/comments`).push({ text, timestamp: new Date().toLocaleString(), likes: 0 })
                .then(() => {
                    input.value = "";
                    showToast("한줄평을 등록했습니다! 💬");
                })
                .catch((error) => {
                    console.error("한줄평 저장 실패:", error);
                    showToast("한줄평을 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.", "error");
                });
        }

        function likeComment(key) {
            if(!dateInput) return;
            if (localStorage.getItem(`liked_${key}`)) return showToast("이미 하트를 눌렀습니다! ❤️", "info");
            database.ref(`meals/${dateInput.value}/${currentTab}/comments/${key}/likes`).transaction(l => (l || 0) + 1)
                .then(() => {
                    localStorage.setItem(`liked_${key}`, true);
                    showToast("하트를 눌렀습니다! ❤️");
                })
                .catch((error) => {
                    console.error("좋아요 저장 실패:", error);
                    showToast("좋아요를 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.", "error");
                });
        }

        function loadComments() {
            if(!dateInput) return;
            const date = dateInput.value; const list = document.getElementById('comment-list');
            const commentsRef = database.ref(`meals/${date}/${currentTab}/comments`);
            const handleComments = (s) => {
                list.replaceChildren(); const data = s.val();
                if (data) Object.keys(data).reverse().forEach(k => {
                    const item = data[k]; const div = document.createElement('div');
                    div.className = 'comment-bubble';

                    const text = document.createElement('div');
                    text.className = 'comment-text';
                    text.textContent = item.text || "";

                    const meta = document.createElement('div');
                    meta.className = 'comment-meta';
                    const timestamp = document.createElement('span');
                    timestamp.textContent = item.timestamp || "";
                    const likeButton = document.createElement('button');
                    likeButton.className = 'like-badge';
                    likeButton.textContent = `❤️ ${item.likes || 0}`;
                    likeButton.addEventListener('click', () => likeComment(k));
                    meta.append(timestamp, likeButton);

                    div.append(text, meta);
                    list.appendChild(div);
                }); else showEmptyListMessage(list, "첫 한줄평을 남겨주세요! 😊");
            };
            replaceFirebaseListener('comments', commentsRef, handleComments);
        }

        function loadPollData() {
            if(!dateInput) return;
            removeFirebaseListener('poll');
            const box = document.getElementById('poll-box');
            const tomorrow = parseSafeDate(dateInput.value); tomorrow.setDate(tomorrow.getDate() + 1);
            
            const y = tomorrow.getFullYear();
            const m = String(tomorrow.getMonth() + 1).padStart(2, '0');
            const d = String(tomorrow.getDate()).padStart(2, '0');
            const tomorrowStr = `${y}-${m}-${d}`;
            
            const menu = (currentTab === 'lunch') ? lunchData[tomorrowStr] : dinnerData[tomorrowStr];
            if (!menu) { box.style.display = 'none'; return; }
            
            const items = filterMenuItems(menu);
            const list = document.getElementById('poll-items-list');
            if (items.length === 0) { box.style.display = 'none'; return; }
            box.style.display = 'block';
            const pollRef = database.ref(`polls/${tomorrowStr}/${currentTab}`);
            const handlePoll = (s) => {
                const votes = s.val() || {}; list.replaceChildren();
                const selectedVoteValue = localStorage.getItem(`poll_${tomorrowStr}_${currentTab}`);
                const selectedVote = /^\d+$/.test(selectedVoteValue || '') ? Number(selectedVoteValue) : -1;
                items.forEach((m, i) => {
                    const div = document.createElement('button');
                    div.type = 'button';
                    div.className = `poll-item-row${selectedVote === i ? ' selected' : ''}`;
                    div.setAttribute('aria-pressed', String(selectedVote === i));
                    div.onclick = () => submitVote(tomorrowStr, i, m);
                    const menuName = document.createElement('span');
                    menuName.textContent = m;
                    const voteCount = document.createElement('b');
                    voteCount.style.color = 'var(--info)';
                    voteCount.textContent = `${votes[i] || 0}명`;
                    div.append(menuName, voteCount);
                    list.appendChild(div);
                });
            };
            replaceFirebaseListener('poll', pollRef, handlePoll);
        }

        async function submitVote(date, idx, name) {
            if (localStorage.getItem(`poll_${date}_${currentTab}`)) return showToast("내일 투표는 이미 하셨습니다! 😊", "info");
            const selectedTab = currentTab;
            const selectedDate = dateInput.value;
            const confirmed = await showConfirm(`"${name}" 메뉴에 투표할까요?`);
            if (!confirmed || selectedTab !== currentTab || selectedDate !== dateInput.value) return;
            database.ref(`polls/${date}/${currentTab}/${idx}`).transaction(v => (v || 0) + 1).then(() => {
                localStorage.setItem(`poll_${date}_${currentTab}`, String(idx));
                showToast("투표 완료! 🔥");
                loadPollData();
            }).catch((error) => {
                console.error("투표 저장 실패:", error);
                showToast("투표를 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.", "error");
            });
        }

        function saveSuggestion() {
            const input = document.getElementById('suggest-input');
            const text = input.value.trim();
            if (!text) return;
            database.ref(`suggestions`).push({ text, timestamp: new Date().toLocaleString() })
                .then(() => {
                    input.value = "";
                    showToast("건의사항을 등록했습니다! 💡");
                })
                .catch((error) => {
                    console.error("건의사항 저장 실패:", error);
                    showToast("건의사항을 저장하지 못했습니다. 잠시 후 다시 시도해 주세요.", "error");
                });
        }

        function loadSuggestions() {
            const list = document.getElementById('suggest-list');
            const suggestionsRef = database.ref(`suggestions`);
            const handleSuggestions = (s) => {
                list.replaceChildren(); const data = s.val();
                if (data) Object.keys(data).reverse().forEach(key => {
                    const item = data[key]; const div = document.createElement('div');
                    div.className = 'comment-bubble'; div.style.borderColor = "#D1E9FF";

                    const text = document.createElement('div');
                    text.className = 'comment-text';
                    text.style.color = 'var(--info)';
                    text.textContent = `💡 ${item.text || ""}`;

                    const timestamp = document.createElement('span');
                    timestamp.className = 'comment-meta';
                    timestamp.textContent = item.timestamp || "";

                    div.append(text, timestamp);
                    list.appendChild(div);
                }); else showEmptyListMessage(list, "건의사항을 남겨주세요! 😊");
            };
            replaceFirebaseListener('suggestions', suggestionsRef, handleSuggestions);
        }

        function changeTab(tab) {
            currentTab = tab; document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.querySelectorAll('.tab-item').forEach(el => el.setAttribute('aria-selected', String(el.id === `tab-${tab}`)));
            updateUI();
        }

        window.addEventListener('beforeunload', () => {
            if (activeMealController) activeMealController.abort();
            Object.keys(activeListeners).forEach(removeFirebaseListener);
        });

        setToday();
        setInitialMealTab();
        updateUI();
    </script>
</body>
</html>
