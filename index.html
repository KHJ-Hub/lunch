<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍱 배정고 오늘의 급식!</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root {
            --primary: #4CAF50; --primary-light: #E8F5E9;
            --secondary: #FF9800; --secondary-light: #FFF3E0;
            --info: #2196F3; --bg: #F5F7FA; --card: #FFFFFF; --like: #FF5252;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg); margin: 0; padding: 15px 0; display: flex; justify-content: center; min-height: 100vh; color: #333; }
        .app-container { width: 100%; max-width: 420px; padding: 0 10px; }
        .main-card { background: var(--card); border-radius: 35px; padding: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.06); text-align: center; }
        
        .header h1 { font-size: 1.6rem; color: #333; margin: 0; font-weight: 800; letter-spacing: -1px; }
        .header p { font-size: 0.9rem; color: #666; margin: 5px 0 25px; font-weight: 700; opacity: 0.8; }

        .date-box { margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .date-label { font-size: 0.8rem; color: #888; font-weight: 600; }
        .date-nav-btn {
            background: #fff; border: 2px solid #EEE; border-radius: 50%;
            width: 38px; height: 38px; cursor: pointer; font-size: 0.8rem;
            color: #999; display: flex; align-items: center; justify-content: center;
            transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); flex-shrink: 0;
        }
        .date-nav-btn:hover { background: #f0f0f0; color: var(--secondary); border-color: var(--secondary); }
        input[type="date"] {
            border: 2px solid #EEE; border-radius: 50px; padding: 10px 20px;
            font-size: 0.95rem; font-weight: 700; color: #555; outline: none;
            background: #FDFDFD; cursor: pointer; width: 60%; text-align: center;
        }

        .tab-switch { display: flex; background: #EEE; border-radius: 20px; padding: 5px; margin-bottom: 20px; gap: 3px; }
        .tab-item { flex: 1; padding: 12px 5px; cursor: pointer; border-radius: 16px; font-weight: 700; color: #888; transition: 0.3s; font-size: 0.85rem; }
        .tab-item.active.lunch { background: var(--primary); color: white; }
        .tab-item.active.dinner { background: var(--secondary); color: white; }
        .tab-item.active.suggest { background: var(--info); color: white; }

        #yesterday-winner-box {
            background: linear-gradient(to right, #FFF9E1, #FFF2CC);
            border: 1px solid #FFE599; border-radius: 15px;
            padding: 10px; margin-bottom: 15px; font-size: 0.85rem; font-weight: 700;
            color: #856404; display: none;
        }

        .meal-content-area {
            background: #FAFAFA; border-radius: 25px; padding: 25px 20px; min-height: 150px;
            border: 1px solid #F0F0F0; transition: 0.3s; position: relative; margin-bottom: 20px;
        }
        .meal-content-area.lunch { background: var(--primary-light); border-color: #C8E6C9; }
        .meal-content-area.dinner { background: var(--secondary-light); border-color: #FFE0B2; }
        
        .meal-label-row { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 15px; }
        .meal-status-label { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; }
        .lunch .meal-status-label { background: var(--primary); color: white; }
        .dinner .meal-status-label { background: var(--secondary); color: white; }
        .average-rating { font-size: 0.85rem; color: #777; font-weight: 600; }

        @keyframes special-glow {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(255,152,0,0.3); }
            50% { transform: scale(1.03); box-shadow: 0 0 25px rgba(255,152,0,0.6); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(255,152,0,0.3); }
        }
        .special-meal-card { animation: special-glow 2s infinite ease-in-out; border: 4px solid #FF9800 !important; background: #FFFDF0 !important; }
        .special-meal-card .meal-status-label { 
            font-size: 1.2rem !important; padding: 8px 18px !important; 
            background: linear-gradient(45deg, #FF5252, #FF9800) !important;
            box-shadow: 0 5px 15px rgba(255,82,82,0.3); margin-bottom: 20px;
            border-radius: 15px !important; font-weight: 900 !important;
        }

        .menu-text { line-height: 1.9; color: #444; font-size: 1.15rem; font-weight: 700; word-break: keep-all; overflow-wrap: break-word; letter-spacing: -0.2px; }

        .star-radio-group { display: flex; justify-content: center; flex-direction: row-reverse; gap: 3px; margin-bottom: 20px; border-top: 1px dashed #DDD; padding-top: 15px; }
        .star-radio-group input { display: none; }
        .star-radio-group label { font-size: 2rem; color: #DDD; cursor: pointer; transition: 0.2s; }
        .star-radio-group label:hover, .star-radio-group label:hover ~ label,
        .star-radio-group input:checked ~ label { color: #FFC107; }

        .poll-section { margin-top: 25px; text-align: left; background: #FDFDFD; padding: 20px; border-radius: 20px; border: 1px solid #EEE; }
        .poll-section h3 { font-size: 1rem; color: #333; margin-bottom: 12px; font-weight: 800; }
        .poll-item-row { display: flex; align-items: center; justify-content: space-between; background: #F9F9F9; padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #F0F0F0; cursor: pointer; font-size: 0.95rem; font-weight: 600; }

        .comments-section { text-align: left; margin-top: 30px; }
        .comment-input-row { display: flex; gap: 8px; margin-bottom: 18px; }
        .comment-input-row input { flex: 1; padding: 12px 18px; border-radius: 15px; border: 2px solid #EEE; outline: none; font-size: 0.9rem; }
        .comment-input-row button { background: #333; color: white; border: none; padding: 0 18px; border-radius: 15px; cursor: pointer; font-weight: 700; }

        .comment-bubble { background: #FFF; padding: 15px; border-radius: 20px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); border: 1px solid #F0F0F0; position: relative; }
        .comment-text { font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; color: #444; }
        .comment-meta { font-size: 0.7rem; color: #AAA; display: flex; align-items: center; gap: 10px; }
        .like-badge { cursor: pointer; border: none; background: rgba(255,82,82,0.1); color: var(--like); padding: 4px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; }
        .del-btn { position: absolute; top: 12px; right: 12px; color: #EEE; border: none; background: none; cursor: pointer; }
        .scroll-area { max-height: 300px; overflow-y: auto; padding-right: 5px; }
        footer { margin-top: 25px; font-size: 0.75rem; color: #BBB; text-align: center; padding-bottom: 15px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="main-card">
            <div class="header">
                <h1>🍱 배정고 오늘의 급식!</h1>
                <p>현정T가 만들었음.</p>
            </div>

            <div class="date-box">
                <span class="date-label">다른 날짜 메뉴 확인 📅</span>
                <div style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;">
                    <button onclick="changeDate(-1)" class="date-nav-btn">◀</button>
                    <input type="date" id="date-selector" onchange="updateUI()">
                    <button onclick="changeDate(1)" class="date-nav-btn">▶</button>
                </div>
            </div>

            <div class="tab-switch">
                <div id="tab-lunch" class="tab-item active lunch" onclick="changeTab('lunch')">☀️ 점심</div>
                <div id="tab-dinner" class="tab-item dinner" onclick="changeTab('dinner')">🌙 저녁</div>
                <div id="tab-suggest" class="tab-item suggest" onclick="changeTab('suggest')">💡 건의함</div>
            </div>

            <div id="yesterday-winner-box">👑 어제 우리가 뽑은 기대 메뉴 1위: 로딩 중...</div>

            <div id="meal-view-container">
                <div id="meal-card" class="meal-content-area lunch">
                    <div class="meal-label-row">
                        <div class="meal-status-label" id="meal-status">오늘의 점심</div>
                        <div id="avg-rating-display" class="average-rating"><span>★</span> 0.0</div>
                    </div>
                    <div class="menu-text" id="menu-content">식단 로딩 중...</div>
                </div>

                <div class="star-radio-group">
                    <input type="radio" id="star5" name="rating" value="5" onclick="submitRating(5)"><label for="star5">★</label>
                    <input type="radio" id="star4" name="rating" value="4" onclick="submitRating(4)"><label for="star4">★</label>
                    <input type="radio" id="star3" name="rating" value="3" onclick="submitRating(3)"><label for="star3">★</label>
                    <input type="radio" id="star2" name="rating" value="2" onclick="submitRating(2)"><label for="star2">★</label>
                    <input type="radio" id="star1" name="rating" value="1" onclick="submitRating(1)"><label for="star1">★</label>
                </div>

                <div class="poll-section" id="poll-box" style="display:none;">
                    <h3>🔥 내일 메뉴 중 가장 기대되는 것은?</h3>
                    <div id="poll-items-list"></div>
                </div>

                <div class="comments-section">
                    <h3>💬 실시간 한줄평</h3>
                    <div class="comment-input-row">
                        <input type="text" id="comment-input" placeholder="급식 후기 한마디!">
                        <button onclick="saveComment()">등록</button>
                    </div>
                    <div id="comment-list" class="scroll-area"></div>
                </div>
            </div>

            <div id="suggestion-view-container" style="display:none; text-align:left;">
                <h3 style="font-size:1.1rem; color:var(--info); font-weight:800; margin-bottom:15px;">💡 건의함</h3>
                <div class="comment-input-row">
                    <input type="text" id="suggest-input" placeholder="기능 요청이나 건의사항을 적어주세요!">
                    <button onclick="saveSuggestion()" style="background:var(--info);">건의</button>
                </div>
                <div id="suggest-list" class="scroll-area"></div>
            </div>
        </div>
        <footer>배정고 1학년 화이팅 ❤️</footer>
    </div>

    <script>
        const ADMIN_PASSWORD = "배정고1234";
        const firebaseConfig = {
            apiKey: "AIzaSyBuUIzRhnj2lohiMZiXWmIosJDluEqp0-o",
            authDomain: "baejeong-lunch.firebaseapp.com",
            databaseURL: "https://baejeong-lunch-default-rtdb.firebaseio.com", 
            projectId: "baejeong-lunch",
            storageBucket: "baejeong-lunch.firebasestorage.app",
            messagingSenderId: "297041913628",
            appId: "1:297041913628:web:dca35b9917a5c2888ffcd9"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const NEIS_API_KEY = "bf6e5aee52104b2e915676c9c6ac6fad"; 

        const dateInput = document.getElementById('date-selector');
        let currentTab = 'lunch';

        let lunchData = {};
        let dinnerData = {};
        
        const bapsimExceptions = []; 
        const specialDinnerDates = [];

        let officeCode = "";
        let schoolCode = "";

        async function initSchoolCode() {
            if (officeCode && schoolCode) return;
            const url = `https://open.neis.go.kr/hub/schoolInfo?Type=json&KEY=${NEIS_API_KEY}&SCHUL_NM=배정고등학교`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.schoolInfo) {
                    const row = data.schoolInfo[1].row[0];
                    officeCode = row.ATPT_OFCDC_SC_CODE;
                    schoolCode = row.SD_SCHUL_CODE;
                }
            } catch (e) {
                console.error("학교 코드 자동 조회 실패:", e);
                officeCode = "C10"; schoolCode = "7150092"; 
            }
        }

        function parseSafeDate(dateStr) {
            if (!dateStr) return new Date();
            const parts = dateStr.split('-');
            return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        async function fetchNeisMeals(centerDateStr) {
            await initSchoolCode(); 
            
            const centerDate = parseSafeDate(centerDateStr);
            const yesterday = new Date(centerDate); yesterday.setDate(yesterday.getDate() - 1);
            const tomorrow = new Date(centerDate); tomorrow.setDate(tomorrow.getDate() + 1);
            
            const formatDate = (d) => {
                return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
            };
            
            const fromYmd = formatDate(yesterday);
            const toYmd = formatDate(tomorrow);
            
            const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&KEY=${NEIS_API_KEY}&ATPT_OFCDC_SC_CODE=${officeCode}&SD_SCHUL_CODE=${schoolCode}&MLSV_FROM_YMD=${fromYmd}&MLSV_TO_YMD=${toYmd}`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.mealServiceDietInfo) {
                    const rows = data.mealServiceDietInfo[1].row;
                    rows.forEach(row => {
                        const ymd = row.MLSV_YMD;
                        const hyphenDate = `${ymd.substring(0,4)}-${ymd.substring(4,6)}-${ymd.substring(6,8)}`;
                        
                        let menuClean = row.DDISH_NM
                            .replace(/<br\s*\/?>/gi, ',')
                            .replace(/\([\d\.]+\)/g, '')
                            .replace(/\s+/g, ' ')
                            .trim();
                        
                        if (row.MMEAL_SC_CODE === "2") lunchData[hyphenDate] = menuClean;
                        if (row.MMEAL_SC_CODE === "3") dinnerData[hyphenDate] = menuClean;
                    });
                }
            } catch (e) { console.error("나이스 API 통신 오류:", e); }
        }

        function filterMenuItems(menuStr) {
            if(!menuStr) return [];
            return menuStr.split(',').map(s=>s.trim()).filter(item => {
                if (item === "") return false;
                if (item.endsWith('밥')) return false; 
                if (item.endsWith('김치') || item === '김치') return false; 
                
                const skipSides = ["깍두기", "석박지", "단무지", "맛김", "김자반", "쌈장", "마늘", "소스"];
                if (skipSides.some(skip => item.includes(skip))) return false;
                
                return true;
            });
        }

        function setToday() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            if(dateInput) dateInput.value = `${y}-${m}-${d}`;
        }

        function changeDate(offset) {
            if(!dateInput) return;
            const current = parseSafeDate(dateInput.value);
            current.setDate(current.getDate() + offset);
            const y = current.getFullYear();
            const m = String(current.getMonth() + 1).padStart(2, '0');
            const d = String(current.getDate()).padStart(2, '0');
            dateInput.value = `${y}-${m}-${d}`;
            updateUI();
        }

        async function updateUI() {
            if(!dateInput) return;
            const date = dateInput.value;
            const card = document.getElementById('meal-card');
            const statusLabel = document.getElementById('meal-status');
            const suggestView = document.getElementById('suggestion-view-container');
            const mealView = document.getElementById('meal-view-container');
            
            if (currentTab === 'suggest') {
                mealView.style.display = 'none'; suggestView.style.display = 'block'; loadSuggestions();
                document.getElementById('yesterday-winner-box').style.display = 'none';
            } else {
                mealView.style.display = 'block'; suggestView.style.display = 'none';
                
                await fetchNeisMeals(date);
                
                const menu = (currentTab === 'lunch') ? lunchData[date] : dinnerData[date];
                statusLabel.innerText = `${currentTab === 'lunch' ? '오늘의 점심' : '오늘의 저녁'}`;
                card.className = `meal-content-area ${currentTab}`;

                const parsedDate = parseSafeDate(date);
                const isThursdayDinner = (currentTab === 'dinner' && parsedDate.getDay() === 4);
                const isException = bapsimExceptions.includes(date);
                const isExamDay = menu && (menu.includes("고사") || menu.includes("시험") || menu.includes("평가"));

                if (menu && !isException && !isExamDay && (isThursdayDinner || specialDinnerDates.includes(date) || menu.includes("특식"))) {
                    card.classList.add('special-meal-card');
                    if (isThursdayDinner) {
                        statusLabel.innerText = "✨ 목 요 밥 심 데 이 ! 💪 ✨";
                    } else {
                        statusLabel.innerText = "✨ 오 늘 의 특 식 ! 🧡 ✨";
                    }
                } else { card.classList.remove('special-meal-card'); }

                if (menu) {
                    const formattedLines = menu.split(',').map(item => {
                        return item.replace(/\(/g, ' (')      
                                   .replace(/,/g, ', ')        
                                   .replace(/\s+/g, ' ')       
                                   .trim();
                    });
                    document.getElementById('menu-content').innerHTML = formattedLines.join('<br>');
                } else {
                    document.getElementById('menu-content').innerHTML = "정보가 없습니다 😴<br><small style='font-size:0.75rem; color:#AAA; font-weight:500;'>(주말·방학이거나 나이스 API 인증키 승인 대기 중)</small>";
                }
                
                try {
                    loadRating(); loadComments(); loadPollData(); loadPreVoteResult();
                } catch(err) { console.error("서브 기능 로드 에러 방어:", err); }
            }
        }

        function loadPreVoteResult() {
            if(!dateInput) return;
            const winnerBox = document.getElementById('yesterday-winner-box');
            const targetDate = dateInput.value;
            const menu = (currentTab === 'lunch') ? lunchData[targetDate] : dinnerData[targetDate];
            
            if (!menu) { winnerBox.style.display = 'none'; return; }
            const menuItems = filterMenuItems(menu);

            database.ref(`polls/${targetDate}/${currentTab}`).once('value', (s) => {
                const votes = s.val();
                if (votes) {
                    let max = -1; let winIdx = -1;
                    Object.keys(votes).forEach(i => { if(votes[i] > max){ max = votes[i]; winIdx = i; } });
                    if (winIdx !== -1 && max > 0 && menuItems[winIdx]) {
                        winnerBox.style.display = 'block';
                        winnerBox.innerHTML = `👑 어제 우리가 뽑은 기대 메뉴 1위: <b>${menuItems[winIdx]}</b> (${max}표!)`;
                    } else { winnerBox.style.display = 'none'; }
                } else { winnerBox.style.display = 'none'; }
            });
        }

        function submitRating(score) {
            if(!dateInput) return;
            const date = dateInput.value;
            if (localStorage.getItem(`voted_${date}_${currentTab}`)) return alert("이미 별점을 남기셨습니다! 😊");
            database.ref(`meals/${date}/${currentTab}/rating`).transaction((data) => {
                if (!data) return { totalScore: score, voterCount: 1, average: score.toFixed(1) };
                const newTotal = (data.totalScore || 0) + score;
                const newCount = (data.voterCount || 0) + 1;
                return { totalScore: newTotal, voterCount: newCount, average: (newTotal / newCount).toFixed(1) };
            }).then(() => { localStorage.setItem(`voted_${date}_${currentTab}`, true); alert("별점 감사합니다! ❤️"); });
        }

        function loadRating() {
            if(!dateInput) return;
            database.ref(`meals/${dateInput.value}/${currentTab}/rating`).on('value', (s) => {
                const d = s.val(); document.getElementById('avg-rating-display').innerHTML = `<span>★</span> ${d ? d.average : '0.0'}`;
            });
        }

        function saveComment() {
            if(!dateInput) return;
            const date = dateInput.value; const input = document.getElementById('comment-input');
            if (!input.value.trim()) return;
            database.ref(`meals/${date}/${currentTab}/comments`).push({ text: input.value, timestamp: new Date().toLocaleString(), likes: 0 });
            input.value = "";
        }

        function likeComment(key) {
            if(!dateInput) return;
            if (localStorage.getItem(`liked_${key}`)) return alert("이미 하트를 눌렀습니다! ❤️");
            database.ref(`meals/${dateInput.value}/${currentTab}/comments/${key}/likes`).transaction(l => (l || 0) + 1).then(() => localStorage.setItem(`liked_${key}`, true));
        }

        function loadComments() {
            if(!dateInput) return;
            const date = dateInput.value; const list = document.getElementById('comment-list');
            database.ref(`meals/${date}/${currentTab}/comments`).on('value', (s) => {
                list.innerHTML = ""; const data = s.val();
                if (data) Object.keys(data).reverse().forEach(k => {
                    const item = data[k]; const div = document.createElement('div');
                    div.className = 'comment-bubble';
                    div.innerHTML = `<div class="comment-text">${item.text}</div><div class="comment-meta"><span>${item.timestamp}</span><button class="like-badge" onclick="likeComment('${k}')">❤️ ${item.likes || 0}</button></div><button class="del-btn" onclick="deleteItem('comments', '${k}')">x</button>`;
                    list.appendChild(div);
                }); else list.innerHTML = "<p style='text-align:center; color:#BBB; font-size:0.8rem;'>첫 한줄평을 남겨주세요! 😊</p>";
            });
        }

        function loadPollData() {
            if(!dateInput) return;
            const box = document.getElementById('poll-box');
            const tomorrow = parseSafeDate(dateInput.value); tomorrow.setDate(tomorrow.getDate() + 1);
            
            const y = tomorrow.getFullYear();
            const m = String(tomorrow.getMonth() + 1).padStart(2, '0');
            const d = String(tomorrow.getDate()).padStart(2, '0');
            const tomorrowStr = `${y}-${m}-${d}`;
            
            const menu = (currentTab === 'lunch') ? lunchData[tomorrowStr] : dinnerData[tomorrowStr];
            if (!menu) { box.style.display = 'none'; return; }
            
            const items = filterMenuItems(menu);
            const list = document.getElementById('poll-items-list');
            if (items.length === 0) { box.style.display = 'none'; return; }
            box.style.display = 'block';
            database.ref(`polls/${tomorrowStr}/${currentTab}`).on('value', (s) => {
                const votes = s.val() || {}; list.innerHTML = "";
                items.forEach((m, i) => {
                    const div = document.createElement('div'); div.className = 'poll-item-row';
                    div.onclick = () => submitVote(tomorrowStr, i, m);
                    div.innerHTML = `<span>${m}</span><b style="color:var(--info)">${votes[i] || 0}명</b>`;
                    list.appendChild(div);
                });
            });
        }

        function submitVote(date, idx, name) {
            if (localStorage.getItem(`poll_${date}_${currentTab}`)) return alert("내일 투표는 이미 하셨습니다! 😊");
            if (confirm(`"${name}"에 투표할까요?`)) {
                database.ref(`polls/${date}/${currentTab}/${idx}`).transaction(v => (v || 0) + 1).then(() => {
                    localStorage.setItem(`poll_${date}_${currentTab}`, true); alert("투표 완료! 🔥");
                });
            }
        }

        function saveSuggestion() {
            const input = document.getElementById('suggest-input'); if (!input.value.trim()) return;
            database.ref(`suggestions`).push({ text: input.value, timestamp: new Date().toLocaleString() });
            input.value = "";
        }

        function loadSuggestions() {
            const list = document.getElementById('suggest-list');
            database.ref(`suggestions`).on('value', (s) => {
                list.innerHTML = ""; const data = s.val();
                if (data) Object.keys(data).reverse().forEach(key => {
                    const item = data[key]; const div = document.createElement('div');
                    div.className = 'comment-bubble'; div.style.borderColor = "#D1E9FF";
                    div.innerHTML = `<div class="comment-text" style="color:var(--info)">💡 ${item.text}</div><span class="comment-meta">${item.timestamp}</span><button class="del-btn" onclick="deleteItem('suggestions', '${key}')">x</button>`;
                    list.appendChild(div);
                }); else list.innerHTML = "<p style='text-align:center; color:#BBB; font-size:0.8rem;'>건의사항을 남겨주세요! 😊</p>";
            });
        }

        function deleteItem(type, key) {
            if (prompt("비밀번호:") === ADMIN_PASSWORD) {
                if (type === 'comments') database.ref(`meals/${dateInput.value}/${currentTab}/comments/${key}`).remove();
                else database.ref(`suggestions/${key}`).remove();
            } else alert("틀렸습니다!");
        }

        function changeTab(tab) {
            currentTab = tab; document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active'); updateUI();
        }

        setToday();
        updateUI();
    </script>
</body>
</html>
